function clone(x){return JSON.parse(JSON.stringify(x))}
function load(){try{return JSON.parse(localStorage.getItem("aakruti-owner-demo"))||clone(seed)}catch(e){return clone(seed)}}
let data=load(),page="overview";

function esc(x){return String(x==null?"":x).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

function head(k,t,s,button){const tips={"YOUR BUSINESS AT A GLANCE":"Overview: Review catalogue totals, pending reviews and new enquiries. Use the tabs to manage each area.","CATALOGUE":"Products: Add or edit product details, prices, publication status and featured items. Export a JSON backup before making major changes.","SOCIAL PROOF":"Reviews: Review customer feedback and approve or hide reviews before they appear publicly.","WEBSITE EDITOR":"Homepage: Update the hero headline, supporting text, call-to-action and contact details. Save changes and check the public website separately.","CUSTOMER INBOX":"Enquiries: Review customer requests and update their follow-up status."};return '<div class="head"><div class="head-title"><div class="eyebrow">'+esc(k)+'</div><button class="head-help" type="button" aria-label="Instructions for '+esc(k)+'" title="Instructions"><i class="fa-solid fa-circle-info" aria-hidden="true"></i><span class="help-tip" role="tooltip">'+esc(tips[k]||"Use this section to review and manage the selected content. Changes in this demo are stored in this browser only.")+'</span></button></div>'+(button||"")+'</div>'}

function rows(){return data.products.map(function(p){return '<tr><td><div class="product"><div class="thumb"><i class="fa-solid fa-couch" aria-hidden="true"></i></div><div><b>'+esc(p.name)+'</b><small>'+esc(p.category)+'</small></div></div></td><td>'+money(p.price)+'</td><td><span class="tag '+(p.status==="Draft"?"draft":"")+'">'+p.status+'</span></td><td>'+(p.featured?"Yes":"—")+'</td><td><div class="actions"><button class="btn small" data-action="edit" data-id="'+p.id+'">Edit</button><button class="btn small" data-action="toggle" data-id="'+p.id+'">'+(p.status==="Published"?"Unpublish":"Publish")+'</button></div></td></tr>'}).join("")}

document.querySelectorAll("[data-page]").forEach(function(b){b.classList.toggle("active",b.dataset.page===page)});

function openProduct(id){const p=id?data.products.find(function(x){return x.id===id}):{name:"",category:"",price:"",status:"Draft",featured:false,description:"",images:[]};const imgs=Array.isArray(p.images)?p.images.slice(0,4):[];while(imgs.length<4)imgs.push("");const kinds=[["Studio shot","Front three-quarter view on Ivory Mist (#F7F4F1) background"],["Room shot","Show the piece in a styled or real room"],["Detail shot","Close-up of fabric, wood grain, joinery, handles or stitching"],["Side view + dimensions","Side profile; include dimensions in the image or product description"]];document.getElementById("modal").innerHTML='<div class="modalbg"><section class="modal product-modal"><h2>'+(id?"Edit product":"Add product")+'</h2><form id="productForm"><div class="field"><label>Product name</label><input name="name" required value="'+esc(p.name)+'"></div><div class="field"><label>Category</label><input name="category" required value="'+esc(p.category)+'"></div><div class="field"><label>Price (₹)</label><input name="price" type="number" min="0" required value="'+esc(p.price)+'"></div><div class="field"><label>Description</label><textarea name="description">'+esc(p.description)+'</textarea></div><div class="field"><label>Status</label><select name="status"><option value="Draft" '+(p.status==="Draft"?"selected":"")+'>Draft</option><option value="Published" '+(p.status==="Published"?"selected":"")+'>Published</option></select></div><div class="field"><label><input type="checkbox" name="featured" '+(p.featured?"checked":"")+' style="width:auto"> Featured pick</label></div><section class="image-editor"><h3>Product images · 4-photo swipe gallery</h3><p class="muted">For each view, paste a hosted image URL or choose an image from your device. Images are saved with this browser’s demo data.</p>'+kinds.map(function(k,i){return '<div class="image-entry"><div class="image-entry-head"><b>'+(i+1)+'. '+k[0]+'</b><span>'+k[1]+'</span></div><div class="image-entry-controls"><input class="image-url" data-image-index="'+i+'" name="image'+i+'" type="url" placeholder="https://example.com/product-view-'+(i+1)+'.jpg" value="'+esc(imgs[i])+'"><label class="btn small image-pick">Choose image<input type="file" accept="image/*" data-image-file="'+i+'" hidden></label></div><div class="image-preview '+(imgs[i]?"has-image":"")+'" data-image-preview="'+i+'">'+(imgs[i]?'<img src="'+esc(imgs[i])+'" alt="'+esc(k[0])+' preview">':'<span>Image preview</span>')+'</div></div>'}).join("")+'<div class="gallery-preview-label">Swipe gallery preview</div><div class="admin-gallery-preview" id="adminGalleryPreview">'+imgs.filter(Boolean).map(function(src){return '<img src="'+esc(src)+'" alt="Product gallery preview">'}).join("")+'</div></section><div class="modalfoot"><button class="btn" type="button" data-action="close">Cancel</button><button class="btn primary">Save product</button></div></form></section></div>';const form=document.getElementById("productForm");function updateImagePreview(i,src){const preview=form.querySelector('[data-image-preview="'+i+'"]');preview.classList.toggle("has-image",!!src);preview.innerHTML=src?'<img src="'+esc(src)+'" alt="'+esc(kinds[i][0])+' preview">':'<span>Image preview</span>';const url=form.querySelector('[data-image-index="'+i+'"]');if(url&&url.value!==src)url.value=src;const gallery=form.querySelector("#adminGalleryPreview");const current=[0,1,2,3].map(function(n){return form.querySelector('[data-image-index="'+n+'"]').value.trim()}).filter(Boolean);gallery.innerHTML=current.map(function(u){return '<img src="'+esc(u)+'" alt="Product gallery preview">'}).join("");}form.querySelectorAll("[data-image-index]").forEach(function(input){input.addEventListener("input",function(){updateImagePreview(Number(input.dataset.imageIndex),input.value.trim())})});form.querySelectorAll("[data-image-file]").forEach(function(input){input.addEventListener("change",function(){const file=input.files&&input.files[0];if(!file)return;if(!file.type.startsWith("image/")){toast("Choose an image file");return}const reader=new FileReader();reader.onload=function(){const image=new Image();image.onload=function(){const max=1100,scale=Math.min(1,max/Math.max(image.naturalWidth,image.naturalHeight)),canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));canvas.getContext("2d").drawImage(image,0,0,canvas.width,canvas.height);const compressed=canvas.toDataURL("image/jpeg",.78);updateImagePreview(Number(input.dataset.imageFile),compressed)};image.onerror=function(){toast("Could not read this image")};image.src=reader.result};reader.readAsDataURL(file)})});form.onsubmit=function(ev){ev.preventDefault();const fd=new FormData(form);const images=[0,1,2,3].map(function(i){return String(fd.get("image"+i)||"").trim()}).filter(Boolean);const item={id:id||Math.max(0,...data.products.map(function(x){return x.id}))+1,name:fd.get("name"),category:fd.get("category"),price:Number(fd.get("price")),description:fd.get("description"),status:fd.get("status"),featured:fd.has("featured"),images:images};if(id)data.products=data.products.map(function(x){return x.id===id?item:x});else data.products.unshift(item);save();document.getElementById("modal").innerHTML="";render();toast("Product saved")}}
function bindForms(){const h=document.getElementById("heroForm");if(h)h.onsubmit=function(ev){ev.preventDefault();const fd=new FormData(h);["eyebrow","title","subtitle","button"].forEach(function(k){data.content[k]=fd.get(k)});save();render();toast("Homepage saved")};const c=document.getElementById("contactForm");if(c)c.onsubmit=function(ev){ev.preventDefault();const fd=new FormData(c);["phone","email","instagram"].forEach(function(k){data.content[k]=fd.get(k)});save();render();toast("Contact details saved")};const search=document.getElementById("search");if(search)search.oninput=function(){const q=search.value.toLowerCase();const found=data.products.filter(function(p){return (p.name+" "+p.category).toLowerCase().includes(q)});document.getElementById("rows").innerHTML=found.map(function(p){return '<tr><td>'+esc(p.name)+'</td><td>'+money(p.price)+'</td><td>'+esc(p.status)+'</td><td>'+(p.featured?"Yes":"—")+'</td><td><button class="btn small" data-action="edit" data-id="'+p.id+'">Edit</button></td></tr>'}).join("")||'<tr><td colspan="5">No products found</td></tr>'};const imp=document.getElementById("importfile");if(imp)imp.onchange=function(){const file=imp.files[0];if(!file)return;const reader=new FileReader();reader.onload=function(){try{const x=JSON.parse(reader.result);if(!x.products||!x.reviews||!x.content||!x.enquiries)throw Error();data=x;save();render();toast("Data imported")}catch(e){toast("Invalid JSON file")}};reader.readAsText(file)}}
document.addEventListener("click",function(ev){const nav=ev.target.closest("[data-page]");if(nav){page=nav.dataset.page;render();return}const b=ev.target.closest("[data-action]");if(!b)return;const a=b.dataset.action,id=Number(b.dataset.id);if(a==="edit")openProduct(b.dataset.id? id:null);if(a==="close")document.getElementById("modal").innerHTML="";if(a==="toggle"){data.products=data.products.map(function(p){return p.id===id?Object.assign({},p,{status:p.status==="Published"?"Draft":"Published"}):p});save();render()}if(a==="approve"){data.reviews=data.reviews.map(function(r){return r.id===id?Object.assign({},r,{status:"Approved"}):r});save();render()}if(a==="feature-review"){data.reviews=data.reviews.map(function(r){return r.id===id?Object.assign({},r,{featured:!r.featured}):r});save();render()}if(a==="delete-review"&&confirm("Delete this review?")){data.reviews=data.reviews.filter(function(r){return r.id!==id});save();render()}if(a==="detail"){const e=data.enquiries.find(function(x){return x.id===id});document.getElementById("modal").innerHTML='<div class="modalbg"><section class="modal"><h2>Enquiry details</h2><p><b>'+esc(e.name)+'</b></p><p>'+esc(e.email)+' · '+esc(e.phone)+'</p><p>'+esc(e.interest)+'</p><p>'+esc(e.message)+'</p><button class="btn primary" data-action="close">Close</button></section></div>'}if(a==="export"){const link=document.createElement("a"),url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));link.href=url;link.download="aakruti-data.json";link.click();URL.revokeObjectURL(url)}if(a==="import")document.getElementById("importfile").click();if(a==="reset"&&confirm("Reset all changes?")){data=clone(seed);save();render();toast("Changes reset")}});
document.addEventListener("change",function(ev){const e=ev.target;if(e.dataset.action==="enquiry-status"){const id=Number(e.dataset.id);data.enquiries=data.enquiries.map(function(x){return x.id===id?Object.assign({},x,{status:e.value}):x});save();toast("Status updated")}});
save();render();
const loginForm=document.getElementById("loginForm");
function showStudio(){document.getElementById("loginScreen").classList.add("hide");document.getElementById("appShell").classList.remove("hide");}
function showLogin(){document.getElementById("appShell").classList.add("hide");document.getElementById("loginScreen").classList.remove("hide");document.getElementById("loginPassword").value="";}
loginForm.addEventListener("submit",async function(ev){ev.preventDefault();const id=document.getElementById("loginId").value.trim();const password=document.getElementById("loginPassword").value;const error=document.getElementById("loginError");const button=loginForm.querySelector('button[type="submit"]');button.disabled=true;button.textContent="Checking…";error.textContent="";try{const response=await fetch("/api/admin-login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"admin_login",adminId:id,password:password})});const result=await response.json();if(response.ok&&result.ok===true){sessionStorage.setItem("aakruti-studio-auth","1");showStudio();}else if(result.error==="admin_not_configured"){error.textContent="Admin access is not configured. Contact the owner.";}else if(result.error==="authentication_unavailable"||response.status>=500){error.textContent="Login service unavailable. Please try again later.";}else{error.textContent="Invalid admin ID or password.";document.getElementById("loginPassword").value="";}}catch(e){error.textContent="Could not connect to the login service. Please try again.";}finally{button.disabled=false;button.textContent="Sign in";}});
document.addEventListener("click",function(ev){const b=ev.target.closest('[data-action="logout"]');if(b){sessionStorage.removeItem("aakruti-studio-auth");showLogin();}});
if(sessionStorage.getItem("aakruti-studio-auth")==="1")showStudio();
