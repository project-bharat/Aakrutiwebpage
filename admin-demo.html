<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Aakruti Owner Studio — Demo</title>
<style>
:root{--ink:#403d4d;--muted:#898493;--bg:#f6f2ef;--paper:#fff;--line:#e9e2dc;--accent:#e96c69;--green:#34785e;--gold:#b18a51}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.demo{background:#fff0d7;color:#795323;text-align:center;padding:9px 14px;font-size:12px;font-weight:700;letter-spacing:.02em}.top{background:#fff;border-bottom:1px solid var(--line);padding:18px clamp(16px,4vw,42px);display:flex;justify-content:space-between;align-items:center;gap:15px;position:sticky;top:0;z-index:3}.brand{font:26px Georgia,serif;letter-spacing:.12em}.brand small{display:block;font:10px system-ui;letter-spacing:.2em;color:var(--muted);margin-top:2px}.pill{border-radius:99px;padding:6px 10px;background:#f7e7e4;color:#a34f4b;font-size:11px;font-weight:700}.layout{display:grid;grid-template-columns:225px minmax(0,1fr);max-width:1440px;margin:auto;min-height:calc(100vh - 100px)}aside{padding:25px 14px;border-right:1px solid var(--line);background:#fbf9f7}.nav{width:100%;text-align:left;border:0;background:transparent;color:#716c7a;padding:12px 14px;border-radius:10px;margin:3px 0;font-weight:600}.nav.active,.nav:hover{background:#f2e7e2;color:#9e514d}.nav span{display:inline-block;width:25px;color:var(--accent)}main{padding:clamp(18px,3vw,38px);min-width:0}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:24px}.eyebrow{text-transform:uppercase;letter-spacing:.16em;color:var(--gold);font-size:10px;font-weight:800}.heading h1{font:clamp(26px,3vw,34px) Georgia,serif;margin:5px 0}.sub{color:var(--muted);margin:0}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 14px;border-radius:9px;font-weight:650}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.small{padding:6px 9px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:22px}.stat,.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 3px 14px #46352b05}.stat label{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;font:27px Georgia,serif;margin:8px 0 2px}.stat small{color:var(--green);font-size:11px}.panel{margin-bottom:18px}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:15px}.panel h2{font:21px Georgia,serif;margin:0}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:620px}th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}th,td{padding:13px 10px;border-bottom:1px solid #f0ebe7;vertical-align:middle}tr:last-child td{border-bottom:0}.product{display:flex;align-items:center;gap:11px}.thumb{width:48px;height:44px;border-radius:8px;background:linear-gradient(135deg,#eee0d4,#cbb9a7);display:grid;place-items:center;color:#8d7564;font-size:18px;flex-shrink:0}.product b{display:block;font-size:13px}.product small{display:block;color:var(--muted);font-size:11px}.tag{display:inline-block;border-radius:99px;padding:4px 8px;font-size:10px;font-weight:800;background:#e6f2ea;color:#34785e}.tag.draft{background:#f5ead9;color:#986d31}.tag.pending{background:#f8e9e2;color:#b15b49}.actions{display:flex;gap:6px;flex-wrap:wrap}.empty{padding:35px;text-align:center;color:var(--muted)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:#696473}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff;color:var(--ink)}.field textarea{min-height:90px;resize:vertical}.check{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.notice{padding:12px 14px;border-radius:9px;background:#f8f0e8;color:#806348;font-size:12px;margin-bottom:17px}.reviewquote{font:17px Georgia,serif}.reviewby{color:var(--muted);font-size:12px;margin-top:8px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.previewhero{border-radius:12px;padding:25px;background:linear-gradient(120deg,#f1e4d9,#f8f1ea);min-height:140px}.previewhero h3{font:25px Georgia,serif;margin:6px 0}.hidden{display:none!important}.footer{color:var(--muted);font-size:11px;text-align:center;padding:18px}.modalback{position:fixed;inset:0;background:#28243170;display:grid;place-items:center;padding:15px;z-index:10}.modal{background:#fff;border-radius:15px;padding:23px;width:min(560px,100%);max-height:90vh;overflow:auto}.modal h2{font:24px Georgia,serif;margin:0 0 18px}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{position:fixed;bottom:20px;right:20px;background:#403d4d;color:#fff;padding:12px 16px;border-radius:9px;z-index:20;box-shadow:0 8px 28px #0002}
@media(max-width:800px){.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px;gap:3px}.nav{white-space:nowrap;width:auto;padding:10px}.nav span{width:auto;margin-right:5px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.cards{grid-template-columns:1fr}}
@media(max-width:460px){.brand{font-size:21px}.stats{gap:8px}.stat{padding:13px}.stat strong{font-size:23px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.top{padding:14px}.heading .btn{width:100%}}
</style></head>
<body>
<div class="demo">DEMO PREVIEW · Sample data only · No real login, database, image upload or customer messages are connected</div>
<header class="top"><div class="brand">AAKRUTI <small>OWNER STUDIO · CONCEPT</small></div><div style="display:flex;align-items:center;gap:10px"><span class="pill">DEMO MODE</span><button class="btn small" id="resetBtn">Reset demo</button></div></header>
<div class="layout"><aside>
<button class="nav active" data-page="overview"><span>◫</span>Overview</button>
<button class="nav" data-page="products"><span>◇</span>Products</button>
<button class="nav" data-page="reviews"><span>☆</span>Customer reviews</button>
<button class="nav" data-page="homepage"><span>▤</span>Homepage content</button>
<button class="nav" data-page="enquiries"><span>✉</span>Enquiries</button>
<button class="nav" data-page="settings"><span>⚙</span>Settings & preview</button>
</aside><main id="main"></main></div>
<div class="footer">Aakruti Owner Studio · Interactive prototype · Demo changes stay in this browser only</div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const initial={
 products:[
 {id:1,name:"Aarav Lounge Chair",category:"Lounge Chairs",price:28900,status:"Published",featured:true,description:"A sculptural lounge chair with warm natural finishes."},
 {id:2,name:"Mira Accent Chair",category:"Accent Chairs",price:18400,status:"Published",featured:true,description:"Elegant proportions for a considered living space."},
 {id:3,name:"Aangan Three-Seater Sofa",category:"Sofas",price:64500,status:"Published",featured:false,description:"Comfort-led seating with a refined silhouette."},
 {id:4,name:"Ira Side Table",category:"Tables",price:12900,status:"Draft",featured:false,description:"A compact accent for modern interiors."}
 ],
 reviews:[
 {id:1,name:"Ananya S.",rating:5,text:"Beautiful finish and thoughtful detailing. The piece feels made for our home.",status:"Approved",featured:true},
 {id:2,name:"Rohan M.",rating:5,text:"The team helped us choose the right proportions and fabric.",status:"Pending",featured:false},
 {id:3,name:"Meera K.",rating:4,text:"Excellent craftsmanship and a calm, timeless design.",status:"Approved",featured:false}
 ],
 content:{eyebrow:"Crafted for considered living",title:"Furniture with a sense of belonging.",subtitle:"Thoughtfully designed pieces for the way you live.",button:"Explore the collection",phone:"+91 98765 43210",email:"hello@aakruti.example",instagram:"@aakruti"},
 enquiries:[
 {id:1,name:"Kavya Shah",email:"kavya@example.com",phone:"+91 98XXX 12345",interest:"Mira Accent Chair",date:"Today",status:"New",message:"Could you share fabric options?"},
 {id:2,name:"Arjun Patel",email:"arjun@example.com",phone:"+91 97XXX 67890",interest:"Custom sofa",date:"Yesterday",status:"Contacted",message:"Interested in custom dimensions."},
 {id:3,name:"Nisha Rao",email:"nisha@example.com",phone:"+91 99XXX 11223",interest:"Dining collection",date:"20 Oct",status:"New",message:"Please share the catalogue."}
 ]};
let data;
try{data=JSON.parse(localStorage.getItem("aakruti-owner-demo")||"null")||structuredClone(initial)}catch(e){data=JSON.parse(JSON.stringify(initial))}
let page="overview";
const money=n=>"₹"+Number(n||0).toLocaleString("en-IN");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function save(){localStorage.setItem("aakruti-owner-demo",JSON.stringify(data))}
function toast(s){document.getElementById("toastRoot").innerHTML='<div class="toast">'+esc(s)+'</div>';setTimeout(()=>document.getElementById("toastRoot").innerHTML="",2300)}
function heading(k,t,s,action=""){return '<div class="heading"><div><div class="eyebrow">'+k+'</div><h1>'+t+'</h1><p class="sub">'+s+'</p></div>'+action+'</div>'}
function stat(label,value,note){return '<div class="stat"><label>'+label+'</label><strong>'+value+'</strong><small>'+note+'</small></div>'}
function productRows(){return data.products.map(p=>'<tr><td><div class="product"><div class="thumb">✳</div><div><b>'+esc(p.name)+'</b><small>'+esc(p.category)+'</small></div></div></td><td>'+money(p.price)+'</td><td><span class="tag '+(p.status==="Draft"?"draft":"")+'">'+p.status+'</span></td><td>'+(p.featured?'Yes':'—')+'</td><td><div class="actions"><button class="btn small" onclick="editProduct('+p.id+')">Edit</button><button class="btn small" onclick="toggleProduct('+p.id+')">'+(p.status==="Published"?"Unpublish":"Publish")+'</button></div></td></tr>').join("")}
function render(){
document.querySelectorAll(".nav").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
const m=document.getElementById("main");
if(page==="overview"){m.innerHTML=heading("YOUR BUSINESS AT A GLANCE","Good day, Aakruti.","A simple place to keep your collection and customer conversations organised.")+'<div class="stats">'+stat("Total products",data.products.length,"In your catalogue")+stat("Published",data.products.filter(p=>p.status==="Published").length,"Visible on website")+stat("Reviews to approve",data.reviews.filter(r=>r.status==="Pending").length,"Awaiting your review")+stat("New enquiries",data.enquiries.filter(e=>e.status==="New").length,"Need a response")+'</div><div class="panel"><div class="panelhead"><h2>Recent products</h2><button class="btn small" onclick="go(\'products\')">Manage products →</button></div><div class="tablewrap"><table><thead><tr><th>Product</th><th>Price</th><th>Status</th><th>Featured</th><th>Action</th></tr></thead><tbody>'+productRows()+'</tbody></table></div></div><div class="cards"><div class="panel"><div class="panelhead"><h2>Customer feedback</h2><button class="btn small" onclick="go(\'reviews\')">Review →</button></div><p class="reviewquote">“'+esc(data.reviews.find(r=>r.status==="Pending")?.text||"No pending reviews")+'”</p><div class="reviewby">— '+esc(data.reviews.find(r=>r.status==="Pending")?.name||"")+' · Pending approval</div></div><div class="panel"><div class="panelhead"><h2>Latest enquiry</h2><button class="btn small" onclick="go(\'enquiries\')">View inbox →</button></div><b>'+esc(data.enquiries[0]?.name||"No enquiries")+'</b><p class="sub">'+esc(data.enquiries[0]?.interest||"")+'</p><span class="tag pending">'+esc(data.enquiries[0]?.status||"")+'</span></div></div>'}
if(page==="products"){m.innerHTML=heading("CATALOGUE","Products","Add pieces, update pricing, and choose what appears on your website.",'<button class="btn primary" onclick="editProduct()">+ Add product</button>')+'<div class="notice">Product edits in this prototype are saved only in this browser. Real website sync will be connected after backend setup.</div><div class="panel"><div class="panelhead"><h2>All products ('+data.products.length+')</h2><input id="productSearch" placeholder="Search products…" style="max-width:220px;padding:9px;border:1px solid var(--line);border-radius:8px" oninput="filterProducts(this.value)"></div><div class="tablewrap"><table><thead><tr><th>Product</th><th>Price</th><th>Status</th><th>Featured</th><th>Actions</th></tr></thead><tbody id="productRows">'+productRows()+'</tbody></table></div></div>'}
if(page==="reviews"){m.innerHTML=heading("SOCIAL PROOF","Customer reviews","Approve feedback before it appears on the public website.")+'<div class="notice">Reviews are sample content. Approval actions are simulated.</div>'+data.reviews.map(r=>'<div class="panel"><div class="panelhead"><div><b>'+esc(r.name)+'</b><div style="color:#b18a51;margin-top:4px">'+("★".repeat(r.rating))+("☆".repeat(5-r.rating))+'</div></div><span class="tag '+(r.status==="Pending"?"pending":"")+'">'+r.status+'</span></div><p class="reviewquote">“'+esc(r.text)+'”</p><div class="actions"><button class="btn small" onclick="reviewStatus('+r.id+',\'Approved\')">Approve</button><button class="btn small" onclick="reviewStatus('+r.id+',\'Pending\')">Mark pending</button><button class="btn small" onclick="toggleReviewFeatured('+r.id+')">'+(r.featured?"Remove featured":"Feature review")+'</button><button class="btn small" onclick="deleteReview('+r.id+')">Delete</button></div></div>').join("")}
if(page==="homepage"){const c=data.content;m.innerHTML=heading("WEBSITE EDITOR","Homepage content","Edit the hero text and contact details shown in this demo.")+'<div class="cards"><div class="panel"><div class="panelhead"><h2>Homepage hero</h2></div><form id="contentForm" class="formgrid"><div class="field full"><label>Eyebrow</label><input name="eyebrow" value="'+esc(c.eyebrow)+'"></div><div class="field full"><label>Main heading</label><input name="title" value="'+esc(c.title)+'"></div><div class="field full"><label>Supporting text</label><textarea name="subtitle">'+esc(c.subtitle)+'</textarea></div><div class="field full"><label>Button label</label><input name="button" value="'+esc(c.button)+'"></div><div class="field full"><button class="btn primary" type="submit">Save homepage text</button></div></form></div><div class="panel"><div class="panelhead"><h2>Contact details</h2></div><form id="contactForm" class="formgrid"><div class="field full"><label>Phone</label><input name="phone" value="'+esc(c.phone)+'"></div><div class="field full"><label>Email</label><input name="email" value="'+esc(c.email)+'"></div><div class="field full"><label>Instagram handle</label><input name="instagram" value="'+esc(c.instagram)+'"></div><div class="field full"><button class="btn primary" type="submit">Save contact details</button></div></form></div></div><div class="panel"><div class="panelhead"><h2>Live preview</h2><span class="pill">DEMO</span></div><div class="previewhero"><div class="eyebrow">'+esc(c.eyebrow)+'</div><h3>'+esc(c.title)+'</h3><p>'+esc(c.subtitle)+'</p><button class="btn primary">'+esc(c.button)+'</button></div></div>';document.getElementById("contentForm").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);["eyebrow","title","subtitle","button"].forEach(k=>c[k]=f.get(k));save();render();toast("Homepage preview saved")};document.getElementById("contactForm").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);["phone","email","instagram"].forEach(k=>c[k]=f.get(k));save();render();toast("Contact details saved")}}
if(page==="enquiries"){m.innerHTML=heading("CUSTOMER INBOX","Enquiries","Review incoming questions and track follow-up status.")+'<div class="notice">These are fictional sample enquiries. No messages are being received or sent.</div><div class="panel"><div class="tablewrap"><table><thead><tr><th>Customer</th><th>Interested in</th><th>Received</th><th>Status</th><th>Update</th></tr></thead><tbody>'+data.enquiries.map(e=>'<tr><td><b>'+esc(e.name)+'</b><small style="display:block;color:var(--muted)">'+esc(e.email)+'</small></td><td>'+esc(e.interest)+'</td><td>'+esc(e.date)+'</td><td><span class="tag '+(e.status==="New"?"pending":"")+'">'+esc(e.status)+'</span></td><td><select aria-label="Enquiry status" onchange="setEnquiry('+e.id+',this.value)" style="padding:7px;border:1px solid var(--line);border-radius:7px"><option '+(e.status==="New"?"selected":"")+' value="New">New</option><option '+(e.status==="Contacted"?"selected":"")+' value="Contacted">Contacted</option><option '+(e.status==="Closed"?"selected":"")+' value="Closed">Closed</option></select><button class="btn small" style="margin-left:5px" onclick="showEnquiry('+e.id+')">Details</button></td></tr>').join("")+'</tbody></table></div></div>'}
if(page==="settings"){m.innerHTML=heading("CONFIGURATION","Preview & future setup","What changes when the real backend is connected.")+'<div class="panel"><h2>Demo environment</h2><p class="sub">All edits are stored in this browser's local storage. Clearing browser data removes them. No credentials are collected.</p><p><span class="tag draft">Not connected</span> D1 database · R2 image storage · secure owner login · live website sync</p><button class="btn" onclick="exportData()">Export demo data (JSON)</button> <button class="btn" onclick="document.getElementById(\'importFile\').click()">Import demo data</button><input id="importFile" type="file" accept="application/json" class="hidden" onchange="importData(this.files[0])"></div><div class="panel"><h2>Planned production connection</h2><ol><li>Configure secure owner authentication and rate limiting.</li><li>Connect D1 for products, approved reviews, homepage content and enquiries.</li><li>Connect R2 for image uploads and managed image URLs.</li><li>Test changes on a preview deployment before publishing.</li><li>Preserve existing analytics and enquiry integrations until verified.</li></ol><div class="notice">No paid R2 subscription or production changes are required to view this prototype.</div></div>'}
}
function go(p){page=p;render()}
document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>go(b.dataset.page));
function editProduct(id){const p=id?data.products.find(x=>x.id===id):{name:"",category:"",price:"",status:"Draft",featured:false,description:""};document.getElementById("modalRoot").innerHTML='<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>'+(id?"Edit product":"Add product")+'</h2><form id="productForm" class="formgrid"><div class="field full"><label>Product name</label><input name="name" required value="'+esc(p.name)+'"></div><div class="field"><label>Category</label><input name="category" required value="'+esc(p.category)+'"></div><div class="field"><label>Price (₹)</label><input name="price" type="number" min="0" required value="'+esc(p.price)+'"></div><div class="field full"><label>Description</label><textarea name="description">'+esc(p.description)+'</textarea></div><div class="field"><label>Website status</label><select name="status"><option '+(p.status==="Draft"?"selected":"")+' value="Draft">Draft</option><option '+(p.status==="Published"?"selected":"")+' value="Published">Published</option></select></div><label class="check" style="align-self:end"><input type="checkbox" name="featured" '+(p.featured?"checked":"")+'> Featured pick</label><div class="field full"><label>Product photo</label><button class="btn" type="button" onclick="toast(\'Image upload is disabled in demo mode\')">＋ Choose image (demo only)</button></div><div class="field full"><label class="check"><input type="checkbox" name="confirmed"> I understand this is demo data only</label></div><div class="field full modalfoot"><button class="btn" type="button" onclick="closeModal()">Cancel</button><button class="btn primary" type="submit">Save product</button></div></form></div></div>';document.getElementById("productForm").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);if(!f.has("confirmed")){toast("Confirm this is demo data");return}const item={id:id||Math.max(0,...data.products.map(x=>x.id))+1,name:f.get("name"),category:f.get("category"),price:Number(f.get("price")),description:f.get("description"),status:f.get("status"),featured:f.has("featured")};if(id)data.products=data.products.map(x=>x.id===id?item:x);else data.products.unshift(item);save();closeModal();render();toast("Demo product saved")}}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}
function toggleProduct(id){data.products=data.products.map(p=>p.id===id?{...p,status:p.status==="Published"?"Draft":"Published"}:p);save();render();toast("Demo status updated")}
function filterProducts(q){document.getElementById("productRows").innerHTML=data.products.filter(p=>(p.name+" "+p.category).toLowerCase().includes(q.toLowerCase())).map(p=>'<tr><td><div class="product"><div class="thumb">✳</div><div><b>'+esc(p.name)+'</b><small>'+esc(p.category)+'</small></div></div></td><td>'+money(p.price)+'</td><td><span class="tag '+(p.status==="Draft"?"draft":"")+'">'+p.status+'</span></td><td>'+(p.featured?'Yes':'—')+'</td><td><div class="actions"><button class="btn small" onclick="editProduct('+p.id+')">Edit</button><button class="btn small" onclick="toggleProduct('+p.id+')">Toggle status</button></div></td></tr>').join("")||'<tr><td colspan="5" class="empty">No matching products</td></tr>'}
function reviewStatus(id,s){data.reviews=data.reviews.map(r=>r.id===id?{...r,status:s}:r);save();render();toast("Demo review updated")}
function toggleReviewFeatured(id){data.reviews=data.reviews.map(r=>r.id===id?{...r,featured:!r.featured}:r);save();render();toast("Featured setting updated")}
function deleteReview(id){if(confirm("Delete this sample review?")){data.reviews=data.reviews.filter(r=>r.id!==id);save();render();toast("Sample review deleted")}}
function setEnquiry(id,s){data.enquiries=data.enquiries.map(e=>e.id===id?{...e,status:s}:e);save();toast("Demo enquiry status updated")}
function showEnquiry(id){const e=data.enquiries.find(x=>x.id===id);document.getElementById("modalRoot").innerHTML='<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>Enquiry details</h2><p><b>'+esc(e.name)+'</b></p><p>'+esc(e.email)+' · '+esc(e.phone)+'</p><p><b>Interest:</b> '+esc(e.interest)+'</p><p>'+esc(e.message)+'</p><div class="modalfoot"><button class="btn primary" onclick="closeModal()">Close</button></div></div></div>'}
function exportData(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="aakruti-demo-data.json";a.click();URL.revokeObjectURL(a.href)}
function importData(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const v=JSON.parse(reader.result);if(!v.products||!v.reviews||!v.content||!v.enquiries)throw Error();data=v;save();render();toast("Demo data imported")}catch(e){toast("Invalid demo JSON file")}};reader.readAsText(file)}
document.getElementById("resetBtn").onclick=()=>{if(confirm("Reset all demo changes to the original sample data?")){data=JSON.parse(JSON.stringify(initial));save();render();toast("Demo reset")}};
save();render();
</script></body></html>
