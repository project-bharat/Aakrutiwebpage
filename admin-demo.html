<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aakruti Owner Studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f3f0;color:#413b49;font:14px/1.5 system-ui,Arial}.banner{text-align:center;background:#fff0d8;color:#785629;padding:10px;font-size:12px;font-weight:700}.top{padding:18px 4%;background:white;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e9e1dc}.logo{display:flex;align-items:center;min-width:0}.brand-logo{display:block;width:230px;max-width:100%;height:auto;object-fit:contain;object-position:left center}.login-brand{display:flex;justify-content:center;align-items:center}.login-brand img{display:block;width:min(290px,100%);height:auto;object-fit:contain}.footer{border-top:1px solid #e9e1dc;background:#fff}.footer strong{color:#413b49;font-weight:700}.layout{display:grid;grid-template-columns:215px 1fr;max-width:1400px;margin:auto;min-height:80vh}aside{padding:18px 12px;background:#fcfaf8;border-right:1px solid #e9e1dc}.nav{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px;border-radius:8px;margin:3px 0;cursor:pointer;color:#413b49;font-weight:600}.nav.active,.nav:hover{background:#f1e5e0;color:#a34f4b}main{padding:clamp(16px,3vw,36px);min-width:0}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}.eyebrow{font-size:10px;letter-spacing:.17em;color:#ad8851;font-weight:800;text-transform:uppercase}h1{font:32px Georgia,serif;margin:5px 0}h2{font:21px Georgia,serif;margin:0 0 12px}.muted{color:#817988}.btn{border:1px solid #e9e1dc;background:#fff;border-radius:8px;padding:9px 13px;cursor:pointer;color:#413b49;font-weight:650}.primary{background:#df706b;color:white;border-color:#df706b}.small{padding:6px 9px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat,.panel{background:white;border:1px solid #e9e1dc;border-radius:13px;padding:17px;margin-bottom:15px}.stat label{display:block;color:#817988;font-size:12px}.stat strong{display:block;font:27px Georgia,serif;margin:7px 0}.notice{padding:12px;border-radius:9px;background:#f7efe6;color:#806348;font-size:12px;margin-bottom:16px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:580px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #f0ebe7}th{font-size:10px;color:#817988;text-transform:uppercase;letter-spacing:.08em}tr:last-child td{border:0}.tag{display:inline-block;border-radius:20px;padding:4px 8px;font-size:10px;font-weight:800;background:#e4f1e8;color:#34785e}.pending{background:#f9e8df;color:#a75542}.draft{background:#f5ebd8;color:#936b30}.product{display:flex;gap:9px;align-items:center}.thumb{width:40px;height:40px;display:grid;place-items:center;border-radius:8px;background:linear-gradient(135deg,#e9d7c8,#c8b3a2)}.product small{display:block;color:#817988}.actions{display:flex;gap:5px;flex-wrap:wrap}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.field label{font-size:12px;font-weight:700}.field input,.field textarea,.field select{padding:10px;border:1px solid #e9e1dc;border-radius:8px;font:inherit;width:100%}.field textarea{min-height:80px}.hero{padding:24px;border-radius:10px;background:linear-gradient(120deg,#efe0d4,#f8f0e8)}.hero h2{font:26px Georgia,serif}.quote{font:18px Georgia,serif}.footer{text-align:center;padding:20px;color:#817988;font-size:11px}.modalbg{position:fixed;inset:0;background:#211d2780;display:grid;place-items:center;padding:15px;z-index:5}.modal{background:white;border-radius:13px;padding:22px;width:min(520px,100%);max-height:90vh;overflow:auto}.modalfoot{display:flex;justify-content:flex-end;gap:8px}.hide{display:none!important}.toast{position:fixed;bottom:20px;right:20px;background:#413b49;color:white;padding:12px 16px;border-radius:9px;z-index:9}@media(max-width:760px){.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto;padding:7px}.nav{white-space:nowrap;width:auto;padding:10px}.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}h1{font-size:27px}}@media(max-width:420px){.logo{font-size:21px}.stat{padding:12px}}
#loginScreen{position:fixed;inset:0;z-index:100;background:linear-gradient(135deg,#2d2139,#6f4249 58%,#b77d69);display:grid;place-items:center;padding:20px}.login-card{width:min(410px,100%);background:#fff;border-radius:18px;padding:34px;box-shadow:0 24px 70px #17101d40}.login-card h1{font:25px Georgia,serif;text-align:center;margin:28px 0 22px}.login-card .field{margin-bottom:16px}.login-card .primary{width:100%;padding:12px}.login-error{color:#b34242;font-size:12px;min-height:18px;margin:8px 0 12px}.login-mark{width:42px;height:3px;background:#bd8a58;margin:18px auto 0}
</style></head><body><div id="loginScreen"><section class="login-card"><div class="login-brand"><img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgF5sA-n8GBWT7wP2lQdcksV_x8LBAeaLWx__RBJVkX5nZ4P0LWH77AcvE1LLqI4zYxN5R14AVAVA6prhvkr9ffkBJweoDPApY0T2GggY0jyVieutdpIGfkZQqzvszbqxENQQvWvl2ni4k9WArdXZrU6okmiXwh0mAvjQq_geXNFQXgcgrnuNNW1pxg0Gk/s320/1000054651.png" alt="Aakruti Furniture" /></div><div class="login-mark"></div><h1>Admin Login</h1><form id="loginForm"><div class="field"><label for="loginId">Admin ID</label><input id="loginId" name="loginId" autocomplete="username" required></div><div class="field"><label for="loginPassword">Password</label><input id="loginPassword" name="loginPassword" type="password" autocomplete="current-password" required></div><div id="loginError" class="login-error" aria-live="polite"></div><button class="btn primary" type="submit">Sign in</button></form></section></div><div id="appShell" class="hide"><header class="top"><div class="logo"><img class="brand-logo" src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgF5sA-n8GBWT7wP2lQdcksV_x8LBAeaLWx__RBJVkX5nZ4P0LWH77AcvE1LLqI4zYxN5R14AVAVA6prhvkr9ffkBJweoDPApY0T2GggY0jyVieutdpIGfkZQqzvszbqxENQQvWvl2ni4k9WArdXZrU6okmiXwh0mAvjQq_geXNFQXgcgrnuNNW1pxg0Gk/s320/1000054651.png" alt="Aakruti Furniture" /></div><div class="actions"><button class="btn small" data-action="reset">Reset changes</button><button class="btn small" data-action="logout">Sign out</button></div></header><div class="layout"><aside><button class="nav active" data-page="overview">Overview</button><button class="nav" data-page="products">Products</button><button class="nav" data-page="reviews">Customer reviews</button><button class="nav" data-page="homepage">Homepage content</button><button class="nav" data-page="enquiries">Enquiries</button></aside><main id="main"></main></div><div id="modal"></div><div id="toast"></div><footer class="footer">Developed by <strong>Bharat Rasve</strong></footer>
<script>
"use strict";
const seed={products:[{id:1,name:"Aarav Lounge Chair",category:"Lounge Chairs",price:28900,status:"Published",featured:true,description:"A sculptural lounge chair with warm natural finishes."},{id:2,name:"Mira Accent Chair",category:"Accent Chairs",price:18400,status:"Published",featured:true,description:"Elegant proportions for a considered living space."},{id:3,name:"Aangan Three-Seater Sofa",category:"Sofas",price:64500,status:"Published",featured:false,description:"Comfort-led seating with a refined silhouette."},{id:4,name:"Ira Side Table",category:"Tables",price:12900,status:"Draft",featured:false,description:"A compact accent for modern interiors."}],reviews:[{id:1,name:"Ananya S.",rating:5,text:"Beautiful finish and thoughtful detailing. The piece feels made for our home.",status:"Approved",featured:true},{id:2,name:"Rohan M.",rating:5,text:"The team helped us choose the right proportions and fabric.",status:"Pending",featured:false},{id:3,name:"Meera K.",rating:4,text:"Excellent craftsmanship and a calm, timeless design.",status:"Approved",featured:false}],content:{eyebrow:"Crafted for considered living",title:"Furniture with a sense of belonging.",subtitle:"Thoughtfully designed pieces for the way you live.",button:"Explore the collection",phone:"+91 98765 43210",email:"hello@aakruti.example",instagram:"@aakruti"},enquiries:[{id:1,name:"Kavya Shah",email:"kavya@example.com",phone:"+91 98XXX 12345",interest:"Mira Accent Chair",date:"Today",status:"New",message:"Could you share fabric options?"},{id:2,name:"Arjun Patel",email:"arjun@example.com",phone:"+91 97XXX 67890",interest:"Custom sofa",date:"Yesterday",status:"Contacted",message:"Interested in custom dimensions."},{id:3,name:"Nisha Rao",email:"nisha@example.com",phone:"+91 99XXX 11223",interest:"Dining collection",date:"20 Oct",status:"New",message:"Please share the catalogue."}]};
function clone(x){return JSON.parse(JSON.stringify(x))}
function load(){try{return JSON.parse(localStorage.getItem("aakruti-owner-demo"))||clone(seed)}catch(e){return clone(seed)}}
let data=load(),page="overview";
function save(){try{localStorage.setItem("aakruti-owner-demo",JSON.stringify(data))}catch(e){}}
function esc(x){return String(x==null?"":x).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function money(x){return "₹"+Number(x||0).toLocaleString("en-IN")}
function toast(s){document.getElementById("toast").innerHTML='<div class="toast">'+esc(s)+'</div>';setTimeout(function(){document.getElementById("toast").innerHTML=""},2200)}
function head(k,t,s,button){return '<div class="head"><div><div class="eyebrow">'+esc(k)+'</div><h1>'+esc(t)+'</h1><p class="muted">'+esc(s)+'</p></div>'+(button||"")+'</div>'}
function stat(a,b,c){return '<div class="stat"><label>'+a+'</label><strong>'+b+'</strong><span class="muted">'+c+'</span></div>'}
function rows(){return data.products.map(function(p){return '<tr><td><div class="product"><div class="thumb">✳</div><div><b>'+esc(p.name)+'</b><small>'+esc(p.category)+'</small></div></div></td><td>'+money(p.price)+'</td><td><span class="tag '+(p.status==="Draft"?"draft":"")+'">'+p.status+'</span></td><td>'+(p.featured?"Yes":"—")+'</td><td><div class="actions"><button class="btn small" data-action="edit" data-id="'+p.id+'">Edit</button><button class="btn small" data-action="toggle" data-id="'+p.id+'">'+(p.status==="Published"?"Unpublish":"Publish")+'</button></div></td></tr>'}).join("")}
function render(){
document.querySelectorAll("[data-page]").forEach(function(b){b.classList.toggle("active",b.dataset.page===page)});
const m=document.getElementById("main");
if(page==="overview")m.innerHTML=head("YOUR BUSINESS AT A GLANCE","Welcome to Aakruti","A simple place to manage the collection and customer conversations.")+'<div class="stats">'+stat("Total products",data.products.length,"In catalogue")+stat("Published",data.products.filter(function(p){return p.status==="Published"}).length,"Currently listed")+stat("Reviews to approve",data.reviews.filter(function(r){return r.status==="Pending"}).length,"Awaiting review")+stat("New enquiries",data.enquiries.filter(function(e){return e.status==="New"}).length,"Need a response")+'</div><section class="panel"><div class="head"><h2>Recent products</h2><button class="btn small" data-page="products">Manage products →</button></div><div class="tablewrap"><table><thead><tr><th>Product</th><th>Price</th><th>Status</th><th>Featured</th><th>Action</th></tr></thead><tbody>'+rows()+'</tbody></table></div></section><div class="grid2"><section class="panel"><h2>Customer feedback</h2><p class="quote">“'+esc((data.reviews.find(function(r){return r.status==="Pending"})||{}).text||"No pending reviews")+'”</p><button class="btn small" data-page="reviews">Manage reviews</button></section><section class="panel"><h2>Latest enquiry</h2><p><b>'+esc((data.enquiries[0]||{}).name||"No enquiries")+'</b></p><p class="muted">'+esc((data.enquiries[0]||{}).interest||"")+'</p><button class="btn small" data-page="enquiries">Open inbox</button></section></div>';
if(page==="products")m.innerHTML=head("CATALOGUE","Products","Add products, edit pricing and select featured pieces.",'<button class="btn primary" data-action="edit">+ Add product</button>')+'<section class="panel"><div class="head"><h2>All products ('+data.products.length+')</h2><input id="search" style="padding:9px;border:1px solid #e9e1dc;border-radius:8px"></div><div class="tablewrap"><table><thead><tr><th>Product</th><th>Price</th><th>Status</th><th>Featured</th><th>Actions</th></tr></thead><tbody id="rows">'+rows()+'</tbody></table></div></section>';
if(page==="reviews")m.innerHTML=head("SOCIAL PROOF","Customer reviews","Approve feedback before it appears on the website.")+''+data.reviews.map(function(r){return '<section class="panel"><div class="head"><div><b>'+esc(r.name)+'</b><div style="color:#b18a51">'+("★".repeat(r.rating))+("☆".repeat(5-r.rating))+'</div></div><span class="tag '+(r.status==="Pending"?"pending":"")+'">'+r.status+'</span></div><p class="quote">“'+esc(r.text)+'”</p><div class="actions"><button class="btn small" data-action="approve" data-id="'+r.id+'">Approve</button><button class="btn small" data-action="feature-review" data-id="'+r.id+'">'+(r.featured?"Unfeature":"Feature")+'</button><button class="btn small" data-action="delete-review" data-id="'+r.id+'">Delete</button></div></section>'}).join("");
if(page==="homepage"){const c=data.content;m.innerHTML=head("WEBSITE EDITOR","Homepage content","Manage the homepage hero and contact details.")+'<div class="grid2"><section class="panel"><h2>Homepage hero</h2><form id="heroForm"><div class="field"><label>Eyebrow</label><input name="eyebrow" value="'+esc(c.eyebrow)+'"></div><div class="field"><label>Main heading</label><input name="title" value="'+esc(c.title)+'"></div><div class="field"><label>Supporting text</label><textarea name="subtitle">'+esc(c.subtitle)+'</textarea></div><div class="field"><label>Button label</label><input name="button" value="'+esc(c.button)+'"></div><button class="btn primary">Save homepage text</button></form></section><section class="panel"><h2>Contact details</h2><form id="contactForm"><div class="field"><label>Phone</label><input name="phone" value="'+esc(c.phone)+'"></div><div class="field"><label>Email</label><input name="email" value="'+esc(c.email)+'"></div><div class="field"><label>Instagram</label><input name="instagram" value="'+esc(c.instagram)+'"></div><button class="btn primary">Save contact details</button></form></section></div><section class="panel"><h2>Homepage preview</h2><div class="hero"><div class="eyebrow">'+esc(c.eyebrow)+'</div><h2>'+esc(c.title)+'</h2><p>'+esc(c.subtitle)+'</p><button class="btn primary">'+esc(c.button)+'</button></div></section>'}
if(page==="enquiries")m.innerHTML=head("CUSTOMER INBOX","Enquiries","Review questions and track follow-up status.")+'<section class="panel"><div class="tablewrap"><table><thead><tr><th>Customer</th><th>Interested in</th><th>Date</th><th>Status</th><th>Update</th></tr></thead><tbody>'+data.enquiries.map(function(e){return '<tr><td><b>'+esc(e.name)+'</b><small style="display:block;color:#817988">'+esc(e.email)+'</small></td><td>'+esc(e.interest)+'</td><td>'+esc(e.date)+'</td><td><span class="tag '+(e.status==="New"?"pending":"")+'">'+esc(e.status)+'</span></td><td><select data-action="enquiry-status" data-id="'+e.id+'"><option '+(e.status==="New"?"selected":"")+' value="New">New</option><option '+(e.status==="Contacted"?"selected":"")+' value="Contacted">Contacted</option><option '+(e.status==="Closed"?"selected":"")+' value="Closed">Closed</option></select> <button class="btn small" data-action="detail" data-id="'+e.id+'">Details</button></td></tr>'}).join("")+'</tbody></table></div></section>';

bindForms();
}
function openProduct(id){const p=id?data.products.find(function(x){return x.id===id}):{name:"",category:"",price:"",status:"Draft",featured:false,description:""};document.getElementById("modal").innerHTML='<div class="modalbg"><section class="modal"><h2>'+(id?"Edit product":"Add product")+'</h2><form id="productForm"><div class="field"><label>Product name</label><input name="name" required value="'+esc(p.name)+'"></div><div class="field"><label>Category</label><input name="category" required value="'+esc(p.category)+'"></div><div class="field"><label>Price (₹)</label><input name="price" type="number" min="0" required value="'+esc(p.price)+'"></div><div class="field"><label>Description</label><textarea name="description">'+esc(p.description)+'</textarea></div><div class="field"><label>Status</label><select name="status"><option value="Draft" '+(p.status==="Draft"?"selected":"")+'>Draft</option><option value="Published" '+(p.status==="Published"?"selected":"")+'>Published</option></select></div><div class="field"><label><input type="checkbox" name="featured" '+(p.featured?"checked":"")+' style="width:auto"> Featured pick</label></div><div class="modalfoot"><button class="btn" type="button" data-action="close">Cancel</button><button class="btn primary">Save product</button></div></form></section></div>';document.getElementById("productForm").onsubmit=function(ev){ev.preventDefault();const fd=new FormData(ev.target);const item={id:id||Math.max(0,...data.products.map(function(x){return x.id}))+1,name:fd.get("name"),category:fd.get("category"),price:Number(fd.get("price")),description:fd.get("description"),status:fd.get("status"),featured:fd.has("featured")};if(id)data.products=data.products.map(function(x){return x.id===id?item:x});else data.products.unshift(item);save();document.getElementById("modal").innerHTML="";render();toast("Product saved")}}
function bindForms(){const h=document.getElementById("heroForm");if(h)h.onsubmit=function(ev){ev.preventDefault();const fd=new FormData(h);["eyebrow","title","subtitle","button"].forEach(function(k){data.content[k]=fd.get(k)});save();render();toast("Homepage saved")};const c=document.getElementById("contactForm");if(c)c.onsubmit=function(ev){ev.preventDefault();const fd=new FormData(c);["phone","email","instagram"].forEach(function(k){data.content[k]=fd.get(k)});save();render();toast("Contact details saved")};const search=document.getElementById("search");if(search)search.oninput=function(){const q=search.value.toLowerCase();const found=data.products.filter(function(p){return (p.name+" "+p.category).toLowerCase().includes(q)});document.getElementById("rows").innerHTML=found.map(function(p){return '<tr><td>'+esc(p.name)+'</td><td>'+money(p.price)+'</td><td>'+esc(p.status)+'</td><td>'+(p.featured?"Yes":"—")+'</td><td><button class="btn small" data-action="edit" data-id="'+p.id+'">Edit</button></td></tr>'}).join("")||'<tr><td colspan="5">No products found</td></tr>'};const imp=document.getElementById("importfile");if(imp)imp.onchange=function(){const file=imp.files[0];if(!file)return;const reader=new FileReader();reader.onload=function(){try{const x=JSON.parse(reader.result);if(!x.products||!x.reviews||!x.content||!x.enquiries)throw Error();data=x;save();render();toast("Data imported")}catch(e){toast("Invalid JSON file")}};reader.readAsText(file)}}
document.addEventListener("click",function(ev){const nav=ev.target.closest("[data-page]");if(nav){page=nav.dataset.page;render();return}const b=ev.target.closest("[data-action]");if(!b)return;const a=b.dataset.action,id=Number(b.dataset.id);if(a==="edit")openProduct(b.dataset.id? id:null);if(a==="close")document.getElementById("modal").innerHTML="";if(a==="toggle"){data.products=data.products.map(function(p){return p.id===id?Object.assign({},p,{status:p.status==="Published"?"Draft":"Published"}):p});save();render()}if(a==="approve"){data.reviews=data.reviews.map(function(r){return r.id===id?Object.assign({},r,{status:"Approved"}):r});save();render()}if(a==="feature-review"){data.reviews=data.reviews.map(function(r){return r.id===id?Object.assign({},r,{featured:!r.featured}):r});save();render()}if(a==="delete-review"&&confirm("Delete this review?")){data.reviews=data.reviews.filter(function(r){return r.id!==id});save();render()}if(a==="detail"){const e=data.enquiries.find(function(x){return x.id===id});document.getElementById("modal").innerHTML='<div class="modalbg"><section class="modal"><h2>Enquiry details</h2><p><b>'+esc(e.name)+'</b></p><p>'+esc(e.email)+' · '+esc(e.phone)+'</p><p>'+esc(e.interest)+'</p><p>'+esc(e.message)+'</p><button class="btn primary" data-action="close">Close</button></section></div>'}if(a==="export"){const link=document.createElement("a"),url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));link.href=url;link.download="aakruti-data.json";link.click();URL.revokeObjectURL(url)}if(a==="import")document.getElementById("importfile").click();if(a==="reset"&&confirm("Reset all changes?")){data=clone(seed);save();render();toast("Changes reset")}});
document.addEventListener("change",function(ev){const e=ev.target;if(e.dataset.action==="enquiry-status"){const id=Number(e.dataset.id);data.enquiries=data.enquiries.map(function(x){return x.id===id?Object.assign({},x,{status:e.value}):x});save();toast("Status updated")}});
save();render();
const loginForm=document.getElementById("loginForm");
function showStudio(){document.getElementById("loginScreen").classList.add("hide");document.getElementById("appShell").classList.remove("hide");}
function showLogin(){document.getElementById("appShell").classList.add("hide");document.getElementById("loginScreen").classList.remove("hide");document.getElementById("loginPassword").value="";}
loginForm.addEventListener("submit",function(ev){ev.preventDefault();const id=document.getElementById("loginId").value.trim();const password=document.getElementById("loginPassword").value;if(id==="admin"&&password==="admin26"){sessionStorage.setItem("aakruti-studio-auth","1");document.getElementById("loginError").textContent="";showStudio();}else{document.getElementById("loginError").textContent="Invalid admin ID or password.";document.getElementById("loginPassword").value="";}});
document.addEventListener("click",function(ev){const b=ev.target.closest('[data-action="logout"]');if(b){sessionStorage.removeItem("aakruti-studio-auth");showLogin();}});
if(sessionStorage.getItem("aakruti-studio-auth")==="1")showStudio();
</script></div></body></html>
