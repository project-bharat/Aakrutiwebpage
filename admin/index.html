<style>

*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--slate);font:14px 'Plus Jakarta Sans',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(440px,100%);background:#fff;border:1px solid var(--line);padding:34px;border-radius:18px}.brand{font-size:22px;font-weight:700;letter-spacing:.02em}.brand span{color:var(--coral)}.muted{color:var(--muted)}.field{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:white;color:var(--slate)}.field:focus{outline:2px solid #ff666633;border-color:var(--coral)}.btn{padding:10px 14px;border:1px solid var(--line);border-radius:9px;background:white;color:var(--slate);font-weight:600}.btn-primary{background:var(--coral);border-color:var(--coral);color:white}.btn:hover{filter:brightness(.98)}.alert{padding:10px 12px;border-radius:8px;background:#fff0ee;color:#a33c42;margin:12px 0}.layout{min-height:100dvh;display:flex;flex-direction:column}.nav{display:grid;gap:5px}.nav button{text-align:left;border:0;background:transparent;padding:11px 13px;border-radius:8px;color:var(--slate)}.nav button.active,.nav button:hover{background:#ff666615;color:#d94c55}.main{padding:28px;min-width:0;flex:1;display:flex;flex-direction:column}.main>footer{margin-top:auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.stat{padding:18px;border:1px solid var(--line);background:#fff;border-radius:12px}.stat .value{font-size:26px;font-weight:700;margin-top:8px}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:16px}.panel h2{margin:0 0 14px;font-size:17px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid #eee;font-size:13px}th{color:var(--muted);font-weight:600}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#f0ece8;font-size:11px;text-transform:capitalize}.actions{display:flex;gap:6px;flex-wrap:wrap}.small{padding:6px 9px;font-size:12px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid .full{grid-column:1/-1}.modal-backdrop{position:fixed;inset:0;background:#3338;display:grid;place-items:center;padding:16px;z-index:10}.modal{background:#fff;width:min(640px,100%);max-height:90vh;overflow:auto;padding:22px;border-radius:14px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.toast{position:fixed;bottom:20px;right:20px;background:#525266;color:white;padding:12px 16px;border-radius:9px;z-index:20}.empty{padding:30px;text-align:center;color:var(--muted)}
.admin-label{display:block;font-size:11px;margin-top:5px;text-transform:uppercase}.admin-account{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11px;overflow-wrap:anywhere}.nav i{width:1.35em;text-align:center;margin-right:4px}

.admin-logo{display:block;width:145px;max-width:44%;height:auto}
.header-controls{display:flex;align-items:center;gap:12px;min-width:0}

.admin-account .admin-label{margin:0;color:#a33c42;font-size:10px;letter-spacing:.05em}

.home-back,.circle-action{border-radius:50%;width:34px;height:34px;min-height:34px;padding:0}
.stat{position:relative;padding-right:46px}.stat .kpi-link{position:absolute;right:8px;bottom:8px;width:32px;min-height:32px;justify-content:center;background:#f5e9eb;border-radius:8px}

[data-status-tone=new]{--status-fill:#fff0ef;--status-border:#df9da2;--status-color:#8c3843}
[data-status-tone=contacted]{--status-fill:#eef5ff;--status-border:#9cb8db;--status-color:#34567d}

.article-preview{border:1px solid var(--line);border-radius:10px;overflow:hidden}.preview-bar{padding:8px 12px;background:#ede8ee;font-size:12px}.article-preview article{padding:16px;overflow-wrap:anywhere}.article-preview img{max-width:100%;max-height:260px;object-fit:contain}.article-preview p{white-space:pre-wrap}
.article-status{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.article-status select{width:112px;margin-left:auto}.milestones{display:flex;flex:1;align-items:center;min-width:160px;gap:4px;font-size:11px}.milestones span{display:flex;align-items:center;gap:4px;flex:1}.milestones span:not(:last-child)::after{content:'';height:1px;flex:1;background:var(--line)}.milestones [aria-current]{font-weight:700;color:#a93744}

.enquiry-table tbody tr{cursor:pointer}.enquiry-table tbody tr:hover{background:#f8f3f4}.detail-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.enquiry-message{white-space:pre-wrap;overflow-wrap:anywhere;max-width:55ch}

</style>

<div id="login-view" class="login-wrap">
 <div class="login-card">

<script>
(function(){
'use strict';
const cfg=window.AAKRUTI_SUPABASE_CONFIG||{};
if(!cfg.url||!cfg.publishableKey||cfg.publishableKey.includes('PASTE_')){document.getElementById('login-error').textContent='Admin configuration is incomplete. Set the Supabase publishable key in admin/config.js.';document.getElementById('login-error').classList.remove('hidden');}
const sb=(cfg.url&&cfg.publishableKey&&!cfg.publishableKey.includes('PASTE_')&&window.supabase)?window.supabase.createClient(cfg.url,cfg.publishableKey):null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slugify=s=>String(s||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
let currentPage='dashboard',profile=null;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2800)}
function errorBox(m){const e=$('#login-error');e.textContent=m;e.classList.remove('hidden')}
function setLogin(){
 closeAdminMenu();
 $('#login-view').classList.remove('hidden');
 $('#app-view').classList.add('hidden');
}
function setApp(){
 $('#login-view').classList.add('hidden');
 $('#app-view').classList.remove('hidden');
 $('#admin-name').textContent=profile?.displayName||'Administrator';
 loadPage(currentPage);
}
const recoveryUrl=new URL(location.href);
const recoveryHash=new URLSearchParams(recoveryUrl.hash.slice(1));
const recoveryLanding=recoveryUrl.searchParams.has('recovery')||
 recoveryHash.get('type')==='recovery';
let recoverySessionId=null;

function showRecovery(title,form=null){
 setLogin();
 for(const id of ['login-caption','login-form','forgot-password','login-error']){

async function boot(){
 if(!sb){
  if(recoveryLanding){showRecovery('Password reset unavailable');recoveryError('The admin sign-in service is unavailable. Try again later.');}
  return;
 }
 // Subscribe before waiting for initialization so a recovery event cannot be missed.
 let acceptRecovery;
 const recoveryEvent=new Promise(resolve=>{acceptRecovery=resolve;});
 sb.auth.onAuthStateChange((event,session)=>{
  if(event==='PASSWORD_RECOVERY'&&recoveryLanding&&session?.user)acceptRecovery(session.user.id);
  if(event==='SIGNED_OUT'){profile=null;setLogin();}
 });
 if(recoveryLanding)showRecovery('Checking your reset link');
 const {data:{session}}=await sb.auth.getSession();
 if(recoveryLanding){
  history.replaceState(null,'',location.pathname+'?recovery=1');
  if(session&&recoveryHash.get('type')==='recovery'&&recoveryHash.has('access_token')){
   // The SDK may publish PASSWORD_RECOVERY just after getSession resolves.
   let timeout;
   recoverySessionId=await Promise.race([recoveryEvent,new Promise(resolve=>{timeout=setTimeout(()=>resolve(null),2000);})]);
   clearTimeout(timeout);
  }
  if(!session||recoverySessionId!==session.user.id){
   invalidRecovery();
   return;
  }
  try{
   await verifyAdmin(session.user);
   showRecovery('Choose a new password','password');
  }catch(error){
   await sb.auth.signOut({scope:'local'});
   recoverySessionId=null;
   profile=null;
   showRecovery('Administrator access unavailable');
   recoveryError(error.message);
  }
  return;
 }
 if(session)await openAdmin(session.user);
}

function articleImageUrl(value){
 if(!value)return '';
 try{
  const url=new URL(value,location.origin);
  return url.protocol==='https:'||url.origin===location.origin?url.href:'';
 }catch{return '';}
}
function initArticleEditor(form){
 const preview=form.querySelector('[data-article-preview]');
 form.querySelector('[data-article-help]').onclick=()=>openAdminDialog('Article JSON format','<p>Include <code>title</code> and <code>content</code>, plus optional <code>slug</code>, <code>excerpt</code>, <code>featured_image</code>, <code>seo_title</code>, <code>seo_description</code>, <code>status</code> and <code>published_at</code>.</p>');
 const fileInput=form.elements.cover_file;
 const dimensions=form.querySelector('[data-cover-dimensions]');
 const stages=form.querySelectorAll('[data-stage]');
 let objectUrl='';
 let pendingImage='';
 function render(){
  preview.querySelector('h3').textContent=form.elements.title.value||'Article title';
  preview.querySelector('[data-preview-excerpt]').textContent=form.elements.excerpt.value;
  preview.querySelector('[data-preview-body]').textContent=form.elements.content.value||'Article content will appear here.';
  for(const stage of stages){
   if(stage.dataset.stage===form.elements.status.value)stage.setAttribute('aria-current','step');
   else stage.removeAttribute('aria-current');
  }
  const image=preview.querySelector('img');
  const src=objectUrl||articleImageUrl(form.elements.featured_image.value);
  if(src===pendingImage)return;
  pendingImage=src;
  image.classList.add('hidden');
  dimensions.textContent='';
  if(src)image.src=src;
  else image.removeAttribute('src');
 }
 const image=preview.querySelector('img');
 image.onload=()=>{
  image.classList.remove('hidden');
  dimensions.textContent=image.naturalWidth+' × '+image.naturalHeight+' px';
 };
 image.onerror=()=>{
  image.classList.add('hidden');
  dimensions.textContent='Cover image could not be previewed.';
 };
 function releaseCover(){
  if(objectUrl)URL.revokeObjectURL(objectUrl);
  objectUrl='';
 }
 fileInput.onchange=()=>{
  releaseCover();
  const file=fileInput.files[0];
  if(file&&(!['image/jpeg','image/png','image/webp','image/avif'].includes(file.type)||file.size>10*1024*1024)){
   fileInput.value='';toast('Choose a JPEG, PNG, WebP or AVIF image up to 10 MB.');
  }
  if(fileInput.files[0])objectUrl=URL.createObjectURL(fileInput.files[0]);
  render();
 };
 form.elements.article_import.onchange=async event=>{
  const input=event.currentTarget;
  const file=input.files[0];
  if(!file)return;
  try{
   if(file.size>2*1024*1024)throw new Error('Use an article JSON file under 2 MB.');
   const parsed=JSON.parse(await file.text());
   const article=parsed?.article??(Array.isArray(parsed)&&parsed.length===1?parsed[0]:parsed);
   if(!article||typeof article.title!=='string'||!article.title.trim()||typeof article.content!=='string'||!article.content.trim())throw new Error('The JSON must contain one article with a title and content.');
   const fields=['title','slug','excerpt','content','featured_image','seo_title','seo_description','status','published_at'];
   for(const key of fields){
    if(article[key]!=null&&typeof article[key]!=='string')throw new Error(key+' must be text.');
   }
   if(article.featured_image&&!articleImageUrl(article.featured_image))throw new Error('The cover image must be an HTTPS or local website URL.');
   if(article.status&&!['draft','published','archived'].includes(article.status))throw new Error('Use draft, published or archived for status.');
   if(article.published_at&&!Number.isFinite(Date.parse(article.published_at)))throw new Error('Use a valid date for published_at.');
   releaseCover();fileInput.value='';
   for(const key of fields)form.elements[key].value=article[key]??(key==='status'?'draft':'');
   render();toast('Article imported. Review it before saving.');
  }catch(error){toast(error instanceof SyntaxError?'This file is not valid JSON.':error.message);}
  finally{input.value='';}
 };
 form.addEventListener('input',render);
 form.addEventListener('change',render);
 const observer=new MutationObserver(()=>{if(!form.isConnected){releaseCover();observer.disconnect();}});
 observer.observe($('#page-content'),{childList:true});
 render();
}
async function articlePayload(fields,row){
 let cover=fields.get('featured_image')||null;
 let uploadedPath=null;
 const file=fields.get('cover_file');
 if(file?.size){
  const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/avif':'avif'}[file.type];
  if(!ext||file.size>10*1024*1024)throw new Error('Choose a JPEG, PNG, WebP or AVIF image up to 10 MB.');
  const bucket=sb.storage.from('product-images');
  const path='products/articles/'+crypto.randomUUID()+'.'+ext;
  const {error}=await bucket.upload(path,file,{contentType:file.type,upsert:false});
  if(error)throw error;
  cover=bucket.getPublicUrl(path).data.publicUrl;
  uploadedPath=path;
 }
 const title=fields.get('title').trim();
 const status=fields.get('status');
 return {uploadedPath,payload:{title,slug:slugify(fields.get('slug')||title),excerpt:fields.get('excerpt'),content:fields.get('content'),
  featured_image:cover,seo_title:fields.get('seo_title'),seo_description:fields.get('seo_description'),status,
  published_at:status==='published'?(fields.get('published_at')||row.published_at||new Date().toISOString()):null}};
}

backdrop.querySelector('#record-form').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,fd=new FormData(f);let payload={};if(type==='category'){payload={name:fd.get('name').trim(),slug:slugify(fd.get('name')),description:fd.get('description'),sort_order:Number(fd.get('sort_order')||0),is_active:fd.has('is_active')}}if(type==='product'){payload={name:fd.get('name').trim(),slug:slugify(fd.get('name')),category_id:fd.get('category_id')||null,short_description:fd.get('short_description'),description:fd.get('description'),price:fd.get('price')?Number(fd.get('price')):null,price_label:fd.get('price_label'),materials:fd.get('materials'),finishes:fd.get('finishes'),featured_image:fd.get('featured_image')||null,is_featured:fd.has('is_featured'),is_active:fd.has('is_active')};const file=fd.get('image_file');if(file&&file.size){const path='products/'+Date.now()+'-'+slugify(file.name);const {error:upErr}=await sb.storage.from('product-images').upload(path,file,{upsert:false,contentType:file.type});if(upErr)return toast('Image upload: '+upErr.message);const {data:urlData}=sb.storage.from('product-images').getPublicUrl(path);payload.featured_image=urlData.publicUrl;const preview=backdrop.querySelector('#featured-preview-img');preview.src=urlData.publicUrl;preview.style.display='';backdrop.querySelector('#featured-upload-status').textContent='Upload successful. Image URL saved to product record.';backdrop.querySelector('[name=featured_image]').value=urlData.publicUrl}}if(type==='blog'){
 const button=f.querySelector('[type=submit]');
 if(button.disabled)return;
 button.disabled=true;
 try{
  const {payload:article,uploadedPath}=await articlePayload(fd,row);
  const query=id?sb.from('blog_posts').update(article).eq('id',id):sb.from('blog_posts').insert(article);
  const {error}=await query.select('id').single();
  if(error){
   if(uploadedPath)await sb.storage.from('product-images').remove([uploadedPath]);
   throw error;
  }
  toast('Article saved');
  if(f.isConnected)loadPage('blog');
 }catch(error){toast(error.message||'The article could not be saved.');}
 finally{button.disabled=false;}
 return;
}const table={product:'products',category:'categories',blog:'blog_posts'}[type];const q=id?sb.from(table).update(payload).eq('id',id):sb.from(table).insert(payload);const {data:saved,error}=await q.select('id').single();if(error)return toast(error.message);if(type==='product'){const productId=id||saved.id;const galleryFiles=Array.from(fd.getAll('gallery_files')).filter(file=>file&&file.size);for(let i=0;i<galleryFiles.length;i++){const file=galleryFiles[i],path='products/gallery/'+productId+'/'+Date.now()+'-'+i+'-'+slugify(file.name);const {error:upErr}=await sb.storage.from('product-images').upload(path,file,{upsert:false,contentType:file.type});if(upErr)return toast('Gallery upload failed: '+upErr.message);const {data:urlData}=sb.storage.from('product-images').getPublicUrl(path);const {error:rowErr}=await sb.from('product_images').insert({product_id:productId,image_url:urlData.publicUrl,alt_text:payload.name+' photo '+(galleryRows.length+i+1),sort_order:galleryRows.length+i+1});if(rowErr)return toast('Gallery record failed: '+rowErr.message)}}backdrop.remove();toast('Saved successfully');loadPage(currentPage)}}
boot().catch(()=>{
 if(recoveryLanding){showRecovery('Password reset unavailable');recoveryError('Try again shortly or request a new reset link.');}
 else errorBox('The sign-in service is unavailable. Try again shortly.');
});
})();
