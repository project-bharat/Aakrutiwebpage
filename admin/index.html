<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Aakruti Admin</title>
<meta name="theme-color" content="#525266">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--coral:#ff6666;--slate:#525266;--paper:#f7f4f1;--white:#fff;--line:#e5ded8;--muted:#817d87}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--slate);font:14px 'Plus Jakarta Sans',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(440px,100%);background:#fff;border:1px solid var(--line);padding:34px;border-radius:18px}.brand{font-size:22px;font-weight:700;letter-spacing:.02em}.brand span{color:var(--coral)}.muted{color:var(--muted)}.field{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:white;color:var(--slate)}.field:focus{outline:2px solid #ff666633;border-color:var(--coral)}.btn{padding:10px 14px;border:1px solid var(--line);border-radius:9px;background:white;color:var(--slate);font-weight:600}.btn-primary{background:var(--coral);border-color:var(--coral);color:white}.btn:hover{filter:brightness(.98)}.alert{padding:10px 12px;border-radius:8px;background:#fff0ee;color:#a33c42;margin:12px 0}.layout{min-height:100vh;display:grid;grid-template-columns:235px 1fr}.sidebar{background:#fff;border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh}.nav{margin-top:28px;display:grid;gap:5px}.nav button{text-align:left;border:0;background:transparent;padding:11px 13px;border-radius:8px;color:var(--slate)}.nav button.active,.nav button:hover{background:#ff666615;color:#d94c55}.main{padding:28px;min-width:0}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.stat{padding:18px;border:1px solid var(--line);background:#fff;border-radius:12px}.stat .value{font-size:26px;font-weight:700;margin-top:8px}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:16px}.panel h2{margin:0 0 14px;font-size:17px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid #eee;font-size:13px}th{color:var(--muted);font-weight:600}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#f0ece8;font-size:11px;text-transform:capitalize}.actions{display:flex;gap:6px;flex-wrap:wrap}.small{padding:6px 9px;font-size:12px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid .full{grid-column:1/-1}.modal-backdrop{position:fixed;inset:0;background:#3338;display:grid;place-items:center;padding:16px;z-index:10}.modal{background:#fff;width:min(640px,100%);max-height:90vh;overflow:auto;padding:22px;border-radius:14px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.toast{position:fixed;bottom:20px;right:20px;background:#525266;color:white;padding:12px 16px;border-radius:9px;z-index:20}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{height:auto;position:static;padding:12px}.nav{display:flex;overflow:auto;margin-top:12px}.nav button{white-space:nowrap}.main{padding:16px}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.cards{grid-template-columns:1fr 1fr}.login-card{padding:24px}}
.admin-label{display:block;font-size:11px;margin-top:5px;text-transform:uppercase}.admin-account{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11px;overflow-wrap:anywhere}.nav i{width:1.35em;text-align:center;margin-right:4px}
</style>
</head>
<body>
<div id="login-view" class="login-wrap">
 <div class="login-card">
  <div class="brand"><img src="../assets/brand/aakruti-horizontal-light.png" data-brand-asset="aakruti-horizontal-light.png" alt="Aakruti Enterprises" width="180" style="height:auto;vertical-align:middle"> <span class="admin-label"><i class="fa-solid fa-shield-halved" aria-hidden="true"></i> Admin</span></div>
  <p id="login-caption" class="muted">Sign in to manage the website</p>
  <form id="login-form">
   <label for="login-email">Email</label><input class="field" id="login-email" type="email" autocomplete="username" required style="margin:7px 0 14px">
   <label for="login-password">Password</label><input class="field" id="login-password" type="password" autocomplete="current-password" required style="margin:7px 0 14px">
   <button class="btn btn-primary" style="width:100%" type="submit">Sign in</button>
  </form>
  <button id="forgot-password" class="btn" type="button" style="margin-top:12px;width:100%">Forgot password?</button>
  <section id="recovery-view" class="hidden" aria-labelledby="recovery-title">
   <h2 id="recovery-title" tabindex="-1">Reset your password</h2>
   <form id="recovery-request" class="hidden">
    <label for="recovery-email">Email</label>
    <input class="field" id="recovery-email" type="email" autocomplete="email" required style="margin:7px 0 14px">
    <button class="btn btn-primary" type="submit" style="width:100%">Send reset link</button>
   </form>
   <form id="recovery-password" class="hidden">
    <label for="new-password">New password</label>
    <input class="field" id="new-password" type="password" autocomplete="new-password" minlength="8" required style="margin:7px 0 14px">
    <label for="confirm-password">Confirm new password</label>
    <input class="field" id="confirm-password" type="password" autocomplete="new-password" minlength="8" required style="margin:7px 0 14px">
    <button class="btn btn-primary" type="submit" style="width:100%">Save new password</button>
   </form>
   <p id="recovery-status" class="muted" role="status"></p>
   <div id="recovery-error" class="alert hidden" role="alert"></div>
   <a class="btn" href="./" style="margin-top:12px">Back to sign in</a>
  </section>
  <div id="login-error" class="alert hidden" role="alert"></div>
  <p class="muted" style="font-size:12px;margin-top:16px">Private administrator area.</p>
 </div>
</div>
<div id="app-view" class="layout hidden">
 <aside class="sidebar">
  <div class="brand"><img src="../assets/brand/aakruti-horizontal-light.png" data-brand-asset="aakruti-horizontal-light.png" alt="Aakruti Enterprises" width="180" style="height:auto;vertical-align:middle"> <span class="admin-label"><i class="fa-solid fa-shield-halved" aria-hidden="true"></i> Admin</span></div>
  <div class="admin-account muted"><i class="fa-regular fa-envelope" aria-hidden="true"></i><span id="admin-email"></span></div>
  <nav class="nav">
   <button data-page="dashboard" class="active"><i class="fa-solid fa-gauge" aria-hidden="true"></i> Overview</button>
   <button data-page="products"><i class="fa-solid fa-couch" aria-hidden="true"></i> Products</button>
   <button data-page="categories"><i class="fa-solid fa-layer-group" aria-hidden="true"></i> Categories</button>
   <button data-page="brand"><i class="fa-solid fa-palette" aria-hidden="true"></i> Brand assets</button>
   <button data-page="blog"><i class="fa-solid fa-newspaper" aria-hidden="true"></i> Blog</button>
   <button data-page="enquiries"><i class="fa-solid fa-inbox" aria-hidden="true"></i> Enquiries</button>
  </nav>
  <button id="logout" class="btn" style="margin-top:22px;width:100%">Sign out</button>
 </aside>
 <main class="main">
  <div class="topbar"><div><h1 id="page-title" style="font-size:24px;margin:0">Overview</h1></div><a class="btn" href="/" target="_blank" rel="noopener">View website ↗</a></div>
  <div id="page-content"></div>
 </main>
</div>
<div id="modal-root"></div>
<div id="toast" class="toast hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script src="../assets/brand-assets.js" defer></script>
<script>
(function(){
'use strict';
const cfg=window.AAKRUTI_SUPABASE_CONFIG||{};
if(!cfg.url||!cfg.publishableKey||cfg.publishableKey.includes('PASTE_')){document.getElementById('login-error').textContent='Admin configuration is incomplete. Set the Supabase publishable key in admin/config.js.';document.getElementById('login-error').classList.remove('hidden');}
const sb=(cfg.url&&cfg.publishableKey&&!cfg.publishableKey.includes('PASTE_')&&window.supabase)?window.supabase.createClient(cfg.url,cfg.publishableKey):null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slugify=s=>String(s||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
let currentPage='dashboard',profile=null;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2800)}
function errorBox(m){const e=$('#login-error');e.textContent=m;e.classList.remove('hidden')}
function setLogin(){
 $('#login-view').classList.remove('hidden');
 $('#app-view').classList.add('hidden');
}
function setApp(){
 $('#login-view').classList.add('hidden');
 $('#app-view').classList.remove('hidden');
 $('#admin-email').textContent=profile?.email||'';
 loadPage(currentPage);
}
const recoveryUrl=new URL(location.href);
const recoveryHash=new URLSearchParams(recoveryUrl.hash.slice(1));
const recoveryLanding=recoveryUrl.searchParams.has('recovery')||
 recoveryHash.get('type')==='recovery';
let recoverySessionId=null;

function showRecovery(title,form=null){
 setLogin();
 for(const id of ['login-caption','login-form','forgot-password','login-error']){
  $('#'+id).classList.add('hidden');
 }
 $('#recovery-view').classList.remove('hidden');
 $('#recovery-title').textContent=title;
 $('#recovery-title').focus();
 $('#recovery-request').classList.toggle('hidden',form!=='request');
 $('#recovery-password').classList.toggle('hidden',form!=='password');
 $('#recovery-status').textContent='';
 $('#recovery-error').classList.add('hidden');
}
function recoveryError(message){
 $('#recovery-error').textContent=message;
 $('#recovery-error').classList.remove('hidden');
}
function invalidRecovery(){
 recoverySessionId=null;
 showRecovery('Reset link unavailable','request');
 recoveryError('This reset link is invalid or has expired. Request a new link below.');
}
async function verifyAdmin(user){
 const {data,error}=await sb.from('admin_profiles').select('id,email,full_name,is_admin').eq('id',user.id).maybeSingle();
 if(error)throw new Error('We could not verify administrator access. Try again shortly.');
 if(!data?.is_admin)throw new Error('No administrator access. Ask your Aakruti administrator to grant access.');
 profile=data;
}
async function openAdmin(user){
 try{
  await verifyAdmin(user);
  setApp();
 }catch(error){
  await sb.auth.signOut({scope:'local'});
  profile=null;
  setLogin();
  errorBox(error.message);
 }
}
async function boot(){
 if(!sb){
  if(recoveryLanding){showRecovery('Password reset unavailable');recoveryError('The admin sign-in service is unavailable. Try again later.');}
  return;
 }
 // Subscribe before waiting for initialization so a recovery event cannot be missed.
 let acceptRecovery;
 const recoveryEvent=new Promise(resolve=>{acceptRecovery=resolve;});
 sb.auth.onAuthStateChange((event,session)=>{
  if(event==='PASSWORD_RECOVERY'&&recoveryLanding&&session?.user)acceptRecovery(session.user.id);
  if(event==='SIGNED_OUT'){profile=null;setLogin();}
 });
 if(recoveryLanding)showRecovery('Checking your reset link');
 const {data:{session}}=await sb.auth.getSession();
 if(recoveryLanding){
  history.replaceState(null,'',location.pathname+'?recovery=1');
  if(session&&recoveryHash.get('type')==='recovery'&&recoveryHash.has('access_token')){
   // The SDK may publish PASSWORD_RECOVERY just after getSession resolves.
   let timeout;
   recoverySessionId=await Promise.race([recoveryEvent,new Promise(resolve=>{timeout=setTimeout(()=>resolve(null),2000);})]);
   clearTimeout(timeout);
  }
  if(!session||recoverySessionId!==session.user.id){
   invalidRecovery();
   return;
  }
  try{
   await verifyAdmin(session.user);
   showRecovery('Choose a new password','password');
  }catch(error){
   await sb.auth.signOut({scope:'local'});
   recoverySessionId=null;
   profile=null;
   showRecovery('Administrator access unavailable');
   recoveryError(error.message);
  }
  return;
 }
 if(session)await openAdmin(session.user);
}
$('#login-form').addEventListener('submit',async event=>{
 event.preventDefault();
 if(!sb)return errorBox('The admin sign-in service is unavailable.');
 $('#login-error').classList.add('hidden');
 const button=event.currentTarget.querySelector('button[type=submit]');
 button.disabled=true;
 try{
  const {data,error}=await sb.auth.signInWithPassword({email:$('#login-email').value.trim(),password:$('#login-password').value});
  if(error){errorBox(error.code==='email_not_confirmed'?'Confirm your email address before signing in.':'Sign-in failed. Check your email and password, or request a reset link.');return;}
  $('#login-password').value='';
  if(data.user)await openAdmin(data.user);
 }catch{errorBox('The sign-in service is unavailable. Try again shortly.');}
 finally{button.disabled=false;}
});
$('#forgot-password').addEventListener('click',()=>{
 showRecovery('Reset your password','request');
 $('#recovery-email').value=$('#login-email').value;
 $('#recovery-email').focus();
});
$('#recovery-request').addEventListener('submit',async event=>{
 event.preventDefault();
 if(!sb)return recoveryError('The password reset service is unavailable. Try again later.');
 const button=event.currentTarget.querySelector('button[type=submit]');
 button.disabled=true;
 $('#recovery-error').classList.add('hidden');
 $('#recovery-status').textContent='';
 try{
  const redirectTo=new URL('/admin/?recovery=1',location.origin).href;
  const {error}=await sb.auth.resetPasswordForEmail($('#recovery-email').value.trim(),{redirectTo});
  if(error&&error.code!=='user_not_found'){
   recoveryError('The reset request could not be sent. Wait a moment and try again.');
   return;
  }
  $('#recovery-status').textContent='If the address is registered, you’ll receive a password reset link. Check your inbox and spam folder.';
 }catch{recoveryError('The reset request could not be sent. Try again shortly.');}
 finally{button.disabled=false;}
});
$('#recovery-password').addEventListener('submit',async event=>{
 event.preventDefault();
 const form=event.currentTarget;
 const password=$('#new-password').value;
 $('#recovery-error').classList.add('hidden');
 if(password!==$('#confirm-password').value)return recoveryError('The passwords do not match.');
 const button=form.querySelector('button[type=submit]');
 button.disabled=true;
 try{
  const {data:{session}}=await sb.auth.getSession();
  if(!session||session.user.id!==recoverySessionId)return invalidRecovery();
  const {error}=await sb.auth.updateUser({password});
  if(error){
   if(['session_not_found','session_expired','refresh_token_not_found'].includes(error.code))return invalidRecovery();
   recoveryError(error.code==='weak_password'?'Choose a stronger password.':error.code==='same_password'?'Choose a password different from your previous one.':'The password could not be updated. Try again or request a new reset link.');
   return;
  }
  recoverySessionId=null;
  form.reset();
  const {error:signOutError}=await sb.auth.signOut();
  if(signOutError)await sb.auth.signOut({scope:'local'});
  profile=null;
  showRecovery('Password updated');
  $('#recovery-status').textContent='Go back to sign in with your new password.';
 }catch{recoveryError('The password reset service is unavailable. Try again shortly.');}
 finally{button.disabled=false;}
});
$('#logout').addEventListener('click',()=>sb?.auth.signOut());
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x===b));currentPage=b.dataset.page;loadPage(currentPage)}));
async function count(table,filters=[]){let q=sb.from(table).select('id',{count:'exact',head:true});filters.forEach(([k,v])=>q=q.eq(k,v));const {count,error}=await q;if(error)throw error;return count||0}
function panel(title,body){return '<section class="panel"><h2>'+title+'</h2>'+body+'</section>'}
async function dashboard(){const [p,c,b,e,n]=await Promise.all([count('products'),count('categories'),count('blog_posts'),count('enquiries'),count('enquiries',[['status','new']])]);return '<div class="cards">'+[['Products',p],['Categories',c],['Blog articles',b],['Enquiries',e]].map(([t,v])=>'<div class="stat"><div class="muted">'+t+'</div><div class="value">'+v+'</div></div>').join('')+'</div>'+panel('New enquiries','<div style="font-size:24px;font-weight:700">'+n+'</div><p class="muted">Awaiting first response</p><button class="btn small" data-goto="enquiries">Open inbox</button>') }
async function listProducts(){const {data,error}=await sb.from('products').select('id,name,slug,is_active,is_featured,created_at').order('created_at',{ascending:false});if(error)throw error;return '<div class="section-head"><h2 style="margin:0">Products</h2><button class="btn btn-primary" data-add="product">Add product</button></div>'+panel('Catalogue',data.length?'<div class="table-wrap"><table><thead><tr><th>Name</th><th>Slug</th><th>Status</th><th>Featured</th><th>Action</th></tr></thead><tbody>'+data.map(p=>'<tr><td>'+esc(p.name)+'</td><td>'+esc(p.slug)+'</td><td><span class="pill">'+(p.is_active?'active':'hidden')+'</span></td><td>'+(p.is_featured?'Yes':'No')+'</td><td><button class="btn small" data-edit-product="'+p.id+'">Edit</button> <button class="btn small" data-delete-product="'+p.id+'">Delete</button></td></tr>').join('')+'</tbody></table></div>':'<div class="empty">No products have been added yet.</div>')}
async function listCategories(){const {data,error}=await sb.from('categories').select('*').order('sort_order');if(error)throw error;return '<div class="section-head"><h2 style="margin:0">Categories</h2><button class="btn btn-primary" data-add="category">Add category</button></div>'+panel('Categories',data.length?'<div class="table-wrap"><table><thead><tr><th>Name</th><th>Slug</th><th>Active</th><th>Action</th></tr></thead><tbody>'+data.map(c=>'<tr><td>'+esc(c.name)+'</td><td>'+esc(c.slug)+'</td><td>'+(c.is_active?'Yes':'No')+'</td><td><button class="btn small" data-edit-category="'+c.id+'">Edit</button> <button class="btn small" data-delete-category="'+c.id+'">Delete</button></td></tr>').join('')+'</tbody></table></div>':'<div class="empty">No categories yet.</div>')}
const brandAssetSlots = [
 ['aakruti-horizontal-light.png', 'Header and admin logo', '#f7f4f1'],
 ['aakruti-vertical-dark.png', 'Footer logo', '#525266'],
 ['aakruti-icon-dark.png', 'Website favicon and catalogue icon', '#525266'],
 ['aakruti-icon-light.png', 'Hero icon', '#f7f4f1']
];
async function listBrandAssets(){
 const bucket=sb.storage.from('brand-assets');
 const {data,error}=await bucket.list('website');
 if(error)throw new Error('Brand assets could not be listed. Run the Supabase setup SQL and refresh. '+error.message);
 const files=new Set(data.map(file=>file.name));
 return '<p class="muted">PNG images up to 5 MB. Upload a replacement to update the website asset.</p>'+brandAssetSlots.map(([name,label,background])=>{
  const url=bucket.getPublicUrl('website/'+name).data.publicUrl;
  const uploaded=files.has(name);
  return panel(label,
   '<img src="'+esc(uploaded?url:'../assets/brand/'+name)+'" alt="'+esc(label)+'" width="160" style="height:70px;object-fit:contain;background:'+background+';border-radius:8px">'+
   '<p class="muted">'+(uploaded?'Supabase · website/'+name:'Using the bundled brand kit image')+'</p>'+
   '<form data-brand-upload="'+name+'"><label>Replacement PNG <input type="file" name="asset" accept="image/png,.png" required></label> <button class="btn btn-primary" type="submit">Upload</button></form>');
 }).join('');
}
async function uploadBrandAsset(event){
 event.preventDefault();
 const form=event.currentTarget;
 const file=form.elements.asset.files[0];
 if(!file||file.type!=='image/png'||file.size>5*1024*1024)return toast('Choose a PNG image up to 5 MB.');
 const button=form.querySelector('button');
 button.disabled=true;
 try{
  const {error}=await sb.storage.from('brand-assets').upload('website/'+form.dataset.brandUpload,file,{
   upsert:true,contentType:'image/png',cacheControl:'60'
  });
  if(error)throw error;
  toast('Brand asset uploaded');
  if(currentPage==='brand')loadPage('brand');
 }catch(error){
  toast('Brand upload failed. '+error.message);
 }finally{
  button.disabled=false;
 }
}
async function listBlog(){const {data,error}=await sb.from('blog_posts').select('id,title,slug,status,published_at,created_at').order('created_at',{ascending:false});if(error)throw error;return '<div class="section-head"><h2 style="margin:0">Articles</h2><button class="btn btn-primary" data-add="blog">New article</button></div>'+panel('Blog posts',data.length?'<div class="table-wrap"><table><thead><tr><th>Title</th><th>Slug</th><th>Status</th><th>Published</th><th>Action</th></tr></thead><tbody>'+data.map(b=>'<tr><td>'+esc(b.title)+'</td><td>'+esc(b.slug)+'</td><td><span class="pill">'+esc(b.status)+'</span></td><td>'+esc(b.published_at?new Date(b.published_at).toLocaleDateString():'—')+'</td><td><button class="btn small" data-edit-blog="'+b.id+'">Edit</button> <button class="btn small" data-delete-blog="'+b.id+'">Delete</button></td></tr>').join('')+'</tbody></table></div>':'<div class="empty">No articles yet.</div>')}
async function listEnquiries(){const {data,error}=await sb.from('enquiries').select('*').order('created_at',{ascending:false});if(error)throw error;return '<div class="section-head"><h2 style="margin:0">Enquiry inbox</h2><button class="btn" data-refresh-enquiries>Refresh</button></div>'+panel('Website submissions',data.length?'<div class="table-wrap"><table><thead><tr><th>Received</th><th>Customer</th><th>Contact</th><th>Enquiry</th><th>Status</th><th>Update</th></tr></thead><tbody>'+data.map(q=>'<tr><td>'+new Date(q.created_at).toLocaleString()+'</td><td>'+esc(q.name)+'</td><td><a href="tel:'+esc(q.phone)+'">'+esc(q.phone)+'</a><div class="muted">'+esc(q.email||'')+'</div></td><td><strong>'+esc(q.subject||q.product_name||'Website enquiry')+'</strong><div class="muted" style="white-space:normal;max-width:360px;margin-top:5px">'+esc(q.message||'No additional details')+'</div></td><td><span class="pill">'+esc(q.status||'new')+'</span></td><td><select class="field" style="min-width:110px;padding:6px" data-status="'+q.id+'">'+['new','contacted','quoted','won','lost'].map(s=>'<option '+(s===(q.status||'new')?'selected':'')+'>'+s+'</option>').join('')+'</select></td></tr>').join('')+'</tbody></table></div>':'<div class="empty">No enquiries received yet.</div>')}async function loadPage(page){$('#page-title').textContent=({dashboard:'Overview',products:'Products',categories:'Categories',brand:'Brand assets',blog:'Blog',enquiries:'Enquiries'})[page]||page;const root=$('#page-content');root.innerHTML='<div class="panel muted">Loading…</div>';try{const render=({dashboard,products:listProducts,categories:listCategories,brand:listBrandAssets,blog:listBlog,enquiries:listEnquiries})[page];const html=await render();if(page!==currentPage||!profile)return;root.innerHTML=html;root.querySelectorAll("[data-brand-upload]").forEach(form=>form.onsubmit=uploadBrandAsset);root.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{currentPage=b.dataset.goto;document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===currentPage));loadPage(currentPage)});root.querySelectorAll('[data-refresh-enquiries]').forEach(b=>b.onclick=()=>loadPage('enquiries'));root.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>openForm(b.dataset.add));root.querySelectorAll('[data-edit-product]').forEach(b=>b.onclick=()=>openForm('product',b.dataset.editProduct));root.querySelectorAll('[data-edit-category]').forEach(b=>b.onclick=()=>openForm('category',b.dataset.editCategory));root.querySelectorAll('[data-edit-blog]').forEach(b=>b.onclick=()=>openForm('blog',b.dataset.editBlog));root.querySelectorAll('[data-delete-product]').forEach(b=>b.onclick=()=>del('products',b.dataset.deleteProduct));root.querySelectorAll('[data-delete-category]').forEach(b=>b.onclick=()=>del('categories',b.dataset.deleteCategory));root.querySelectorAll('[data-delete-blog]').forEach(b=>b.onclick=()=>del('blog_posts',b.dataset.deleteBlog));root.querySelectorAll('[data-status]').forEach(s=>s.onchange=async()=>{const {error}=await sb.from('enquiries').update({status:s.value}).eq('id',s.dataset.status);if(error)toast(error.message);else toast('Enquiry status updated')})}catch(e){if(page===currentPage&&profile)root.innerHTML='<div class="alert">'+esc(e.message)+'</div>'}}
async function del(table,id){if(!confirm('Delete this record? This cannot be undone.'))return;const {error}=await sb.from(table).delete().eq('id',id);if(error)toast(error.message);else{toast('Deleted');loadPage(currentPage)}}
async function openForm(type,id){let row={};if(id){const table={product:'products',category:'categories',blog:'blog_posts'}[type];const {data,error}=await sb.from(table).select('*').eq('id',id).single();if(error)return toast(error.message);row=data}let cats=[],galleryRows=[];if(type==='product'){const r=await sb.from('categories').select('id,name').order('name');cats=r.data||[];if(id){const g=await sb.from('product_images').select('id,image_url,alt_text,sort_order').eq('product_id',id).order('sort_order');galleryRows=g.data||[]}}
const forms={
category:'<label>Name *</label><input class="field" name="name" required value="'+esc(row.name||'')+'"><label>Description</label><textarea class="field" name="description">'+esc(row.description||'')+'</textarea><label>Sort order</label><input class="field" name="sort_order" type="number" value="'+(row.sort_order||0)+'"><label><input name="is_active" type="checkbox" '+(row.is_active!==false?'checked':'')+'> Active</label>',
product:'<label>Name *</label><input class="field" name="name" required value="'+esc(row.name||'')+'"><label>Category</label><select class="field" name="category_id"><option value="">Uncategorized</option>'+cats.map(c=>'<option value="'+c.id+'" '+(row.category_id===c.id?'selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select><label>Short description</label><input class="field" name="short_description" value="'+esc(row.short_description||'')+'"><label>Description</label><textarea class="field" name="description" rows="4">'+esc(row.description||'')+'</textarea><label>Price (optional)</label><input class="field" name="price" type="number" step="0.01" value="'+esc(row.price||'')+'"><label>Price label</label><input class="field" name="price_label" value="'+esc(row.price_label||'')+'" placeholder="Price on request"><label>Materials</label><input class="field" name="materials" value="'+esc(row.materials||'')+'"><label>Finishes</label><input class="field" name="finishes" value="'+esc(row.finishes||'')+'"><label>Featured image URL</label><input class="field" name="featured_image" value="'+esc(row.featured_image||'')+'"><label>Upload featured image to storage</label><input name="image_file" type="file" accept="image/jpeg,image/png,image/webp,image/avif" style="display:none"><button type="button" class="btn" data-select-featured>Choose featured photo</button><div class="full" id="featured-upload-preview" style="display:flex;align-items:center;gap:10px;margin:4px 0 12px"><img id="featured-preview-img" src="" style="width:100px;height:100px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:none" alt="Featured image preview"><span id="featured-upload-status" class="muted">Choose a file; the image preview and upload status will appear here.</span></div><label>Additional gallery photos (select multiple)</label><input name="gallery_files" type="file" accept="image/jpeg,image/png,image/webp,image/avif" multiple style="display:none"><button type="button" class="btn" data-select-gallery>Choose gallery photos</button><small class="muted full" data-gallery-selection>No gallery photos chosen.</small><div class="full"><small class="muted">Gallery photos are added to the product after saving. Existing gallery photos:</small><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">'+galleryRows.map(g=>'<img src="'+esc(g.image_url)+'" alt="" style="width:88px;height:88px;object-fit:cover;border-radius:8px;border:1px solid var(--line)">').join('')+'</div></div><label><input name="is_featured" type="checkbox" '+(row.is_featured?'checked':'')+'> Featured</label><label><input name="is_active" type="checkbox" '+(row.is_active!==false?'checked':'')+'> Published/active</label>',
blog:'<label>Title *</label><input class="field" name="title" required value="'+esc(row.title||'')+'"><label>Excerpt</label><textarea class="field" name="excerpt" rows="2">'+esc(row.excerpt||'')+'</textarea><label>Article content *</label><textarea class="field" name="content" rows="8" required>'+esc(row.content||'')+'</textarea><label>Cover image URL</label><input class="field" name="featured_image" value="'+esc(row.featured_image||'')+'"><label>SEO title</label><input class="field" name="seo_title" value="'+esc(row.seo_title||'')+'"><label>SEO description</label><textarea class="field" name="seo_description">'+esc(row.seo_description||'')+'</textarea><label>Status</label><select class="field" name="status"><option '+(row.status==='draft'?'selected':'')+'>draft</option><option '+(row.status==='published'?'selected':'')+'>published</option><option '+(row.status==='archived'?'selected':'')+'>archived</option></select>'
};
const backdrop=document.createElement('div');backdrop.className='modal-backdrop';backdrop.innerHTML='<div class="modal"><div class="modal-head"><h2 style="margin:0">'+(id?'Edit ':'Add ')+({product:'product',category:'category',blog:'article'}[type])+'</h2><button class="btn" data-close>Close</button></div><form id="record-form" class="form-grid">'+forms[type]+'<div class="full" style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px"><button type="button" class="btn" data-close>Cancel</button><button class="btn btn-primary" type="submit">Save</button></div></form></div>';$('#modal-root').append(backdrop);backdrop.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>backdrop.remove());backdrop.addEventListener('click',e=>{if(e.target===backdrop)backdrop.remove()});
if(type==='product'){const featuredInput=backdrop.querySelector('[name=image_file]'),featuredPreview=backdrop.querySelector('#featured-preview-img'),featuredStatus=backdrop.querySelector('#featured-upload-status');backdrop.querySelector('[data-select-featured]').onclick=()=>featuredInput.click();backdrop.querySelector('[data-select-gallery]').onclick=()=>backdrop.querySelector('[name=gallery_files]').click();if(row.featured_image){featuredPreview.src=row.featured_image;featuredPreview.style.display='';featuredStatus.textContent='Current saved image preview. Select a new file to replace it.';}featuredInput.addEventListener('change',()=>{const file=featuredInput.files?.[0],preview=backdrop.querySelector('#featured-preview-img'),status=backdrop.querySelector('#featured-upload-status');if(!file){status.textContent=row.featured_image?'Current saved image remains.':'No new file selected.';return;}if(file.size>10*1024*1024){featuredInput.value='';status.textContent='File is too large. Maximum upload size is 10 MB.';toast('Image exceeds 10 MB limit');return;}preview.src=URL.createObjectURL(file);preview.style.display='';status.textContent='Selected file: '+file.name+' ('+(file.size/1024/1024).toFixed(2)+' MB). Upload occurs when you click Save.';});backdrop.querySelector('[name=gallery_files]').addEventListener('change',e=>{const files=Array.from(e.target.files||[]),info=backdrop.querySelector('[data-gallery-selection]');const tooLarge=files.find(x=>x.size>10*1024*1024);if(tooLarge){e.target.value='';if(info)info.textContent='One or more files exceed the 10 MB limit.';toast('Each gallery photo must be 10 MB or less');return;}if(info)info.textContent=files.length?'Selected '+files.length+' gallery photo(s): '+files.map(x=>x.name).join(', '):'No gallery photos chosen.';});}
backdrop.querySelector('#record-form').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,fd=new FormData(f);let payload={};if(type==='category'){payload={name:fd.get('name').trim(),slug:slugify(fd.get('name')),description:fd.get('description'),sort_order:Number(fd.get('sort_order')||0),is_active:fd.has('is_active')}}if(type==='product'){payload={name:fd.get('name').trim(),slug:slugify(fd.get('name')),category_id:fd.get('category_id')||null,short_description:fd.get('short_description'),description:fd.get('description'),price:fd.get('price')?Number(fd.get('price')):null,price_label:fd.get('price_label'),materials:fd.get('materials'),finishes:fd.get('finishes'),featured_image:fd.get('featured_image')||null,is_featured:fd.has('is_featured'),is_active:fd.has('is_active')};const file=fd.get('image_file');if(file&&file.size){const path='products/'+Date.now()+'-'+slugify(file.name);const {error:upErr}=await sb.storage.from('product-images').upload(path,file,{upsert:false,contentType:file.type});if(upErr)return toast('Image upload: '+upErr.message);const {data:urlData}=sb.storage.from('product-images').getPublicUrl(path);payload.featured_image=urlData.publicUrl;const preview=backdrop.querySelector('#featured-preview-img');preview.src=urlData.publicUrl;preview.style.display='';backdrop.querySelector('#featured-upload-status').textContent='Upload successful. Image URL saved to product record.';backdrop.querySelector('[name=featured_image]').value=urlData.publicUrl}}if(type==='blog'){payload={title:fd.get('title').trim(),slug:slugify(fd.get('title')),excerpt:fd.get('excerpt'),content:fd.get('content'),featured_image:fd.get('featured_image')||null,seo_title:fd.get('seo_title'),seo_description:fd.get('seo_description'),status:fd.get('status'),published_at:fd.get('status')==='published'?(row.published_at||new Date().toISOString()):null}}const table={product:'products',category:'categories',blog:'blog_posts'}[type];const q=id?sb.from(table).update(payload).eq('id',id):sb.from(table).insert(payload);const {data:saved,error}=await q.select('id').single();if(error)return toast(error.message);if(type==='product'){const productId=id||saved.id;const galleryFiles=Array.from(fd.getAll('gallery_files')).filter(file=>file&&file.size);for(let i=0;i<galleryFiles.length;i++){const file=galleryFiles[i],path='products/gallery/'+productId+'/'+Date.now()+'-'+i+'-'+slugify(file.name);const {error:upErr}=await sb.storage.from('product-images').upload(path,file,{upsert:false,contentType:file.type});if(upErr)return toast('Gallery upload failed: '+upErr.message);const {data:urlData}=sb.storage.from('product-images').getPublicUrl(path);const {error:rowErr}=await sb.from('product_images').insert({product_id:productId,image_url:urlData.publicUrl,alt_text:payload.name+' photo '+(galleryRows.length+i+1),sort_order:galleryRows.length+i+1});if(rowErr)return toast('Gallery record failed: '+rowErr.message)}}backdrop.remove();toast('Saved successfully');loadPage(currentPage)}}
boot().catch(()=>{
 if(recoveryLanding){showRecovery('Password reset unavailable');recoveryError('Try again shortly or request a new reset link.');}
 else errorBox('The sign-in service is unavailable. Try again shortly.');
});
})();
