<head>

<link rel="apple-touch-icon" href="./icons/aakruti-192.png">

<style>
:root{--coral:#ff6666;--slate:#525266;--paper:#f7f4f1;--white:#fff;--line:#e5ded8;--muted:#817d87}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--slate);font:14px 'Plus Jakarta Sans',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(440px,100%);background:#fff;border:1px solid var(--line);padding:34px;border-radius:18px}.brand{font-size:22px;font-weight:700;letter-spacing:.02em}.brand span{color:var(--coral)}.muted{color:var(--muted)}.field{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:white;color:var(--slate)}.field:focus{outline:2px solid #ff666633;border-color:var(--coral)}.btn{padding:10px 14px;border:1px solid var(--line);border-radius:9px;background:white;color:var(--slate);font-weight:600}.btn-primary{background:var(--coral);border-color:var(--coral);color:white}.btn:hover{filter:brightness(.98)}.alert{padding:10px 12px;border-radius:8px;background:#fff0ee;color:#a33c42;margin:12px 0}.layout{min-height:100vh}.nav{display:grid;gap:5px}.nav button{text-align:left;border:0;background:transparent;padding:11px 13px;border-radius:8px;color:var(--slate)}.nav button.active,.nav button:hover{background:#ff666615;color:#d94c55}.main{padding:28px;min-width:0}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.stat{padding:18px;border:1px solid var(--line);background:#fff;border-radius:12px}.stat .value{font-size:26px;font-weight:700;margin-top:8px}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:16px}.panel h2{margin:0 0 14px;font-size:17px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid #eee;font-size:13px}th{color:var(--muted);font-weight:600}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#f0ece8;font-size:11px;text-transform:capitalize}.actions{display:flex;gap:6px;flex-wrap:wrap}.small{padding:6px 9px;font-size:12px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid .full{grid-column:1/-1}.modal-backdrop{position:fixed;inset:0;background:#3338;display:grid;place-items:center;padding:16px;z-index:10}.modal{background:#fff;width:min(640px,100%);max-height:90vh;overflow:auto;padding:22px;border-radius:14px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.toast{position:fixed;bottom:20px;right:20px;background:#525266;color:white;padding:12px 16px;border-radius:9px;z-index:20}.empty{padding:30px;text-align:center;color:var(--muted)}
.admin-label{display:block;font-size:11px;margin-top:5px;text-transform:uppercase}.admin-account{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11px;overflow-wrap:anywhere}.nav i{width:1.35em;text-align:center;margin-right:4px}

.admin-header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px clamp(14px,3vw,32px);background:#fff;border-bottom:1px solid var(--line)}
.admin-logo{display:block;width:145px;max-width:44%;height:auto}
.header-controls{display:flex;align-items:center;gap:12px;min-width:0}
.admin-account{min-width:0;display:grid;gap:3px;justify-items:end;text-align:right;margin:0;font-size:12px;color:var(--slate)}
.admin-account .admin-label{margin:0;color:#a33c42;font-size:10px;letter-spacing:.05em}
#admin-name{max-width:100%;font-weight:700;overflow-wrap:anywhere}
.btn.menu-toggle,.btn.menu-close{width:44px;height:44px;padding:0;font-size:18px}
.admin-menu{position:fixed;inset:0 0 0 auto;margin:0;width:min(320px,90vw);max-width:none;height:100dvh;max-height:none;padding:0;border:0;border-left:1px solid var(--line);background:#fff;color:var(--slate);box-shadow:-14px 0 44px #24203426}
.admin-menu::backdrop{background:#23213170}
.menu-content{display:flex;flex-direction:column;gap:16px;min-height:100%;padding:18px}
.menu-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}
.menu-heading h2{margin:0;font-size:20px}
.nav button{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600}
.nav button.active{color:#a33c42}
.nav i{flex:none;margin:0}
.menu-footer{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
#logout{width:110px}
body:has(.admin-menu[open]){overflow:hidden}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:7px;min-height:40px;text-decoration:none;white-space:nowrap;flex:none}
.btn-primary{background:#a93744;border-color:#a93744}
.btn:focus-visible,.nav button:focus-visible{outline:2px solid #a93744;outline-offset:2px}
.topbar{margin-bottom:16px;flex-wrap:wrap}
.topbar-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#page-title{margin:0;font-size:clamp(22px,4vw,30px);letter-spacing:-.035em}
.page-action{min-width:128px}
.view-site{font-size:12px}
.stat{min-width:0;min-height:105px;display:grid;align-content:center;gap:8px}
.stat .value{margin:0;line-height:1.15}
.stat .muted{overflow-wrap:anywhere}
.stat-icon{color:#a33c42;margin-right:6px}
.panel{min-width:0}
.table-panel{padding:0;overflow:hidden;margin-top:0}
.table-wrap{max-width:100%}
.table-wrap:focus-visible{outline:2px solid #a93744;outline-offset:-2px}
thead th{background:#ede8ee;color:#423c50;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td{overflow-wrap:anywhere}
td:last-child:has(.icon-action){white-space:nowrap}
.icon-action{width:36px;height:36px;min-height:36px;padding:0}
.icon-action[data-delete-product],.icon-action[data-delete-category],.icon-action[data-delete-blog]{color:#a33c42}
.article-editor{max-width:900px;margin-top:0;padding:clamp(16px,4vw,32px)}
.article-editor .form-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.article-field{display:grid;gap:7px;min-width:0}
.article-field label{font-weight:600}
.article-field textarea{resize:vertical}
.record-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:12px}
@media(max-width:900px){
 .main{padding:18px 14px}
 .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .stat{padding:14px}
 .table-wrap th:last-child,.table-wrap td:last-child{position:sticky;right:0;box-shadow:-1px 0 var(--line)}
 .table-wrap td:last-child{background:white}
}
@media(max-width:520px){
 .form-grid,.article-editor .form-grid{grid-template-columns:minmax(0,1fr)}
 .form-grid .full{grid-column:auto}
 .login-card{padding:24px}
 .icon-action{width:40px;height:40px;min-height:40px}
}

.page-heading{display:flex;align-items:center;gap:10px}
.home-back{width:40px;padding:0}
.kpi-link{display:inline-flex;align-items:center;gap:6px;justify-self:start;min-height:32px;font-size:12px;font-weight:700;color:#a33c42;background:none;border:0;padding:0;text-align:left}
.kpi-link:hover{text-decoration:underline}
.pipeline{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,110px),1fr));gap:8px}
.pipeline-card{display:grid;gap:6px;min-width:0;padding:11px;text-align:left;background:#f7f4f1;border:1px solid var(--line);border-radius:9px;color:var(--slate)}
.pipeline-card:hover,.pipeline-card:focus-visible{background:#f9e8e8;border-color:#a33c42}
.pipeline-card strong{font-size:22px}
.enquiry-filter{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.enquiry-filter select{width:auto}
.analytics-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,155px),1fr));gap:12px;align-items:end}
.analytics-form label{display:grid;gap:6px;min-width:0}
.analytics-form button{justify-self:start}
.analytics-form .field{min-width:0}
</style>
</head>
<body>
<div id="login-view" class="login-wrap">
 <div class="login-card">
  <div class="brand"><img src="../assets/brand/aakruti-horizontal-light.png" data-brand-asset="aakruti-horizontal-light.png" alt="Aakruti Enterprises" width="180" style="height:auto;vertical-align:middle"> <span class="admin-label"><i class="fa-solid fa-shield-halved" aria-hidden="true"></i> Admin</span></div>
  <p id="login-caption" class="muted">Sign in to manage the website</p>
  <form id="login-form">
   <label for="login-email">Email</label><input class="field" id="login-email" type="email" autocomplete="username" required style="margin:7px 0 14px">
   <label for="login-password">Password</label><input class="field" id="login-password" type="password" autocomplete="current-password" required style="margin:7px 0 14px">
   <button class="btn btn-primary" style="width:100%" type="submit">Sign in</button>
  </form>
  <button id="forgot-password" class="btn" type="button" style="margin-top:12px;width:100%">Forgot password?</button>
  <section id="recovery-view" class="hidden" aria-labelledby="recovery-title">
   <h2 id="recovery-title" tabindex="-1">Reset your password</h2>
   <form id="recovery-request" class="hidden">
    <label for="recovery-email">Email</label>
    <input class="field" id="recovery-email" type="email" autocomplete="email" required style="margin:7px 0 14px">

    <label for="new-password">New password</label>

 </header>
 <dialog id="admin-menu" class="admin-menu" aria-labelledby="admin-menu-title">
  <div class="menu-content">
   <div class="menu-heading"><h2 id="admin-menu-title">Menu</h2><button id="admin-menu-close" class="btn menu-close" type="button" aria-label="Close admin menu" autofocus><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></div>

   <button data-page="products"><i class="fa-solid fa-couch" aria-hidden="true"></i> Products</button>
   <button data-page="categories"><i class="fa-solid fa-layer-group" aria-hidden="true"></i> Categories</button>

 </dialog>
 <main class="main">

  <div id="page-content"></div>
 </main>
</div>

<script src="./config.js"></script>
<script src="../assets/brand-assets.js" defer></script>
<script>
(function(){
'use strict';
const cfg=window.AAKRUTI_SUPABASE_CONFIG||{};
if(!cfg.url||!cfg.publishableKey||cfg.publishableKey.includes('PASTE_')){document.getElementById('login-error').textContent='Admin configuration is incomplete. Set the Supabase publishable key in admin/config.js.';document.getElementById('login-error').classList.remove('hidden');}
const sb=(cfg.url&&cfg.publishableKey&&!cfg.publishableKey.includes('PASTE_')&&window.supabase)?window.supabase.createClient(cfg.url,cfg.publishableKey):null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slugify=s=>String(s||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
let currentPage='dashboard',profile=null;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2800)}
function errorBox(m){const e=$('#login-error');e.textContent=m;e.classList.remove('hidden')}
function setLogin(){
 closeAdminMenu();
 $('#login-view').classList.remove('hidden');
 $('#app-view').classList.add('hidden');
}
function setApp(){
 $('#login-view').classList.add('hidden');
 $('#app-view').classList.remove('hidden');
 $('#admin-name').textContent=profile?.displayName||'Administrator';
 loadPage(currentPage);
}
const recoveryUrl=new URL(location.href);
const recoveryHash=new URLSearchParams(recoveryUrl.hash.slice(1));
const recoveryLanding=recoveryUrl.searchParams.has('recovery')||
 recoveryHash.get('type')==='recovery';
let recoverySessionId=null;

function showRecovery(title,form=null){
 setLogin();
 for(const id of ['login-caption','login-form','forgot-password','login-error']){
  $('#'+id).classList.add('hidden');
 }
 $('#recovery-view').classList.remove('hidden');
 $('#recovery-title').textContent=title;
 $('#recovery-title').focus();
 $('#recovery-request').classList.toggle('hidden',form!=='request');
 $('#recovery-password').classList.toggle('hidden',form!=='password');
 $('#recovery-status').textContent='';
 $('#recovery-error').classList.add('hidden');
}
function recoveryError(message){
 $('#recovery-error').textContent=message;
 $('#recovery-error').classList.remove('hidden');
}
function invalidRecovery(){
 recoverySessionId=null;
 showRecovery('Reset link unavailable','request');
 recoveryError('This reset link is invalid or has expired. Request a new link below.');
}
async function verifyAdmin(user){
 const {data,error}=await sb.from('admin_profiles').select('id,email,full_name,is_admin').eq('id',user.id).maybeSingle();
 if(error)throw new Error('We could not verify administrator access. Try again shortly.');
 if(!data?.is_admin)throw new Error('No administrator access. Ask your Aakruti administrator to grant access.');
 const metadata=user.user_metadata||{};
 const displayName=[data.full_name,metadata.full_name,metadata.name,metadata.display_name]
  .find(value=>typeof value==='string'&&value.trim());
 profile={...data,displayName:displayName?.trim()};
}
async function openAdmin(user){
 try{
  await verifyAdmin(user);
  setApp();
 }catch(error){
  await sb.auth.signOut({scope:'local'});
  profile=null;
  setLogin();
  errorBox(error.message);
 }
}
async function boot(){
 if(!sb){
  if(recoveryLanding){showRecovery('Password reset unavailable');recoveryError('The admin sign-in service is unavailable. Try again later.');}
  return;
 }
 // Subscribe before waiting for initialization so a recovery event cannot be missed.
 let acceptRecovery;
 const recoveryEvent=new Promise(resolve=>{acceptRecovery=resolve;});
 sb.auth.onAuthStateChange((event,session)=>{
  if(event==='PASSWORD_RECOVERY'&&recoveryLanding&&session?.user)acceptRecovery(session.user.id);
  if(event==='SIGNED_OUT'){profile=null;setLogin();}
 });
 if(recoveryLanding)showRecovery('Checking your reset link');
 const {data:{session}}=await sb.auth.getSession();
 if(recoveryLanding){
  history.replaceState(null,'',location.pathname+'?recovery=1');
  if(session&&recoveryHash.get('type')==='recovery'&&recoveryHash.has('access_token')){
   // The SDK may publish PASSWORD_RECOVERY just after getSession resolves.
   let timeout;
   recoverySessionId=await Promise.race([recoveryEvent,new Promise(resolve=>{timeout=setTimeout(()=>resolve(null),2000);})]);
   clearTimeout(timeout);
  }
  if(!session||recoverySessionId!==session.user.id){
   invalidRecovery();
   return;
  }
  try{
   await verifyAdmin(session.user);
   showRecovery('Choose a new password','password');
  }catch(error){
   await sb.auth.signOut({scope:'local'});
   recoverySessionId=null;
   profile=null;
   showRecovery('Administrator access unavailable');
   recoveryError(error.message);
  }
  return;
 }
 if(session)await openAdmin(session.user);
}
$('#login-form').addEventListener('submit',async event=>{
 event.preventDefault();
 if(!sb)return errorBox('The admin sign-in service is unavailable.');
 $('#login-error').classList.add('hidden');
 const button=event.currentTarget.querySelector('button[type=submit]');
 button.disabled=true;
 try{
  const {data,error}=await sb.auth.signInWithPassword({email:$('#login-email').value.trim(),password:$('#login-password').value});
  if(error){errorBox(error.code==='email_not_confirmed'?'Confirm your email address before signing in.':'Sign-in failed. Check your email and password, or request a reset link.');return;}
  $('#login-password').value='';
  if(data.user)await openAdmin(data.user);
 }catch{errorBox('The sign-in service is unavailable. Try again shortly.');}
 finally{button.disabled=false;}
});
$('#forgot-password').addEventListener('click',()=>{
 showRecovery('Reset your password','request');
 $('#recovery-email').value=$('#login-email').value;
 $('#recovery-email').focus();
});
$('#recovery-request').addEventListener('submit',async event=>{
 event.preventDefault();
 if(!sb)return recoveryError('The password reset service is unavailable. Try again later.');
 const button=event.currentTarget.querySelector('button[type=submit]');
 button.disabled=true;
 $('#recovery-error').classList.add('hidden');
 $('#recovery-status').textContent='';
 try{
  const redirectTo=new URL('/admin/?recovery=1',location.origin).href;
  const {error}=await sb.auth.resetPasswordForEmail($('#recovery-email').value.trim(),{redirectTo});
  if(error&&error.code!=='user_not_found'){
   recoveryError('The reset request could not be sent. Wait a moment and try again.');
   return;
  }
  $('#recovery-status').textContent='If the address is registered, you’ll receive a password reset link. Check your inbox and spam folder.';
 }catch{recoveryError('The reset request could not be sent. Try again shortly.');}
 finally{button.disabled=false;}
});
$('#recovery-password').addEventListener('submit',async event=>{
 event.preventDefault();
 const form=event.currentTarget;
 const password=$('#new-password').value;
 $('#recovery-error').classList.add('hidden');
 if(password!==$('#confirm-password').value)return recoveryError('The passwords do not match.');
 const button=form.querySelector('button[type=submit]');
 button.disabled=true;
 try{
  const {data:{session}}=await sb.auth.getSession();
  if(!session||session.user.id!==recoverySessionId)return invalidRecovery();
  const {error}=await sb.auth.updateUser({password});
  if(error){
   if(['session_not_found','session_expired','refresh_token_not_found'].includes(error.code))return invalidRecovery();
   recoveryError(error.code==='weak_password'?'Choose a stronger password.':error.code==='same_password'?'Choose a password different from your previous one.':'The password could not be updated. Try again or request a new reset link.');
   return;
  }
  recoverySessionId=null;
  form.reset();
  const {error:signOutError}=await sb.auth.signOut();
  if(signOutError)await sb.auth.signOut({scope:'local'});
  profile=null;
  showRecovery('Password updated');
  $('#recovery-status').textContent='Go back to sign in with your new password.';
 }catch{recoveryError('The password reset service is unavailable. Try again shortly.');}
 finally{button.disabled=false;}
});
const adminMenu=$('#admin-menu');
const menuToggle=$('#admin-menu-toggle');
function closeAdminMenu(){
 if(adminMenu.open)adminMenu.close();
 menuToggle.setAttribute('aria-expanded','false');
}
menuToggle.addEventListener('click',()=>{
 adminMenu.showModal();
 menuToggle.setAttribute('aria-expanded','true');
});
$('#admin-menu-close').addEventListener('click',closeAdminMenu);
adminMenu.addEventListener('cancel',event=>{
 event.preventDefault();
 closeAdminMenu();
});
adminMenu.addEventListener('close',()=>menuToggle.setAttribute('aria-expanded','false'));
adminMenu.addEventListener('click',event=>{
 if(event.target===adminMenu)closeAdminMenu();
});
$('#logout').addEventListener('click',()=>{
 closeAdminMenu();
 return sb?.auth.signOut();
});
const enquiryStatuses=['new','contacted','quoted','won','lost'];
let enquiryStatus='';
let pageRequest=0;
function navigateAdmin(page,status=''){
 enquiryStatus=page==='enquiries'?status:'';
 currentPage=page;
 document.querySelectorAll('[data-page]').forEach(button=>{
  const active=button.dataset.page===page;
  button.classList.toggle('active',active);

if(type==='product'){const featuredInput=backdrop.querySelector('[name=image_file]'),featuredPreview=backdrop.querySelector('#featured-preview-img'),featuredStatus=backdrop.querySelector('#featured-upload-status');backdrop.querySelector('[data-select-featured]').onclick=()=>featuredInput.click();backdrop.querySelector('[data-select-gallery]').onclick=()=>backdrop.querySelector('[name=gallery_files]').click();if(row.featured_image){featuredPreview.src=row.featured_image;featuredPreview.style.display='';featuredStatus.textContent='Current saved image preview. Select a new file to replace it.';}featuredInput.addEventListener('change',()=>{const file=featuredInput.files?.[0],preview=backdrop.querySelector('#featured-preview-img'),status=backdrop.querySelector('#featured-upload-status');if(!file){status.textContent=row.featured_image?'Current saved image remains.':'No new file selected.';return;}if(file.size>10*1024*1024){featuredInput.value='';status.textContent='File is too large. Maximum upload size is 10 MB.';toast('Image exceeds 10 MB limit');return;}preview.src=URL.createObjectURL(file);preview.style.display='';status.textContent='Selected file: '+file.name+' ('+(file.size/1024/1024).toFixed(2)+' MB). Upload occurs when you click Save.';});backdrop.querySelector('[name=gallery_files]').addEventListener('change',e=>{const files=Array.from(e.target.files||[]),info=backdrop.querySelector('[data-gallery-selection]');const tooLarge=files.find(x=>x.size>10*1024*1024);if(tooLarge){e.target.value='';if(info)info.textContent='One or more files exceed the 10 MB limit.';toast('Each gallery photo must be 10 MB or less');return;}if(info)info.textContent=files.length?'Selected '+files.length+' gallery photo(s): '+files.map(x=>x.name).join(', '):'No gallery photos chosen.';});}
backdrop.querySelector('#record-form').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,fd=new FormData(f);let payload={};if(type==='category'){payload={name:fd.get('name').trim(),slug:slugify(fd.get('name')),description:fd.get('description'),sort_order:Number(fd.get('sort_order')||0),is_active:fd.has('is_active')}}if(type==='product'){payload={name:fd.get('name').trim(),slug:slugify(fd.get('name')),category_id:fd.get('category_id')||null,short_description:fd.get('short_description'),description:fd.get('description'),price:fd.get('price')?Number(fd.get('price')):null,price_label:fd.get('price_label'),materials:fd.get('materials'),finishes:fd.get('finishes'),featured_image:fd.get('featured_image')||null,is_featured:fd.has('is_featured'),is_active:fd.has('is_active')};const file=fd.get('image_file');if(file&&file.size){const path='products/'+Date.now()+'-'+slugify(file.name);const {error:upErr}=await sb.storage.from('product-images').upload(path,file,{upsert:false,contentType:file.type});if(upErr)return toast('Image upload: '+upErr.message);const {data:urlData}=sb.storage.from('product-images').getPublicUrl(path);payload.featured_image=urlData.publicUrl;const preview=backdrop.querySelector('#featured-preview-img');preview.src=urlData.publicUrl;preview.style.display='';backdrop.querySelector('#featured-upload-status').textContent='Upload successful. Image URL saved to product record.';backdrop.querySelector('[name=featured_image]').value=urlData.publicUrl}}if(type==='blog'){payload={title:fd.get('title').trim(),slug:slugify(fd.get('title')),excerpt:fd.get('excerpt'),content:fd.get('content'),featured_image:fd.get('featured_image')||null,seo_title:fd.get('seo_title'),seo_description:fd.get('seo_description'),status:fd.get('status'),published_at:fd.get('status')==='published'?(row.published_at||new Date().toISOString()):null}}const table={product:'products',category:'categories',blog:'blog_posts'}[type];const q=id?sb.from(table).update(payload).eq('id',id):sb.from(table).insert(payload);const {data:saved,error}=await q.select('id').single();if(error)return toast(error.message);if(type==='product'){const productId=id||saved.id;const galleryFiles=Array.from(fd.getAll('gallery_files')).filter(file=>file&&file.size);for(let i=0;i<galleryFiles.length;i++){const file=galleryFiles[i],path='products/gallery/'+productId+'/'+Date.now()+'-'+i+'-'+slugify(file.name);const {error:upErr}=await sb.storage.from('product-images').upload(path,file,{upsert:false,contentType:file.type});if(upErr)return toast('Gallery upload failed: '+upErr.message);const {data:urlData}=sb.storage.from('product-images').getPublicUrl(path);const {error:rowErr}=await sb.from('product_images').insert({product_id:productId,image_url:urlData.publicUrl,alt_text:payload.name+' photo '+(galleryRows.length+i+1),sort_order:galleryRows.length+i+1});if(rowErr)return toast('Gallery record failed: '+rowErr.message)}}backdrop.remove();toast('Saved successfully');loadPage(currentPage)}}
boot().catch(()=>{
 if(recoveryLanding){showRecovery('Password reset unavailable');recoveryError('Try again shortly or request a new reset link.');}
 else errorBox('The sign-in service is unavailable. Try again shortly.');
});
})();
